<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaginator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a id="backToHubBtn" class="back-to-hub-btn" href="../index.html">&#8592; Back to Hub</a>
    <a id="echoDonjonBtn" class="echo-donjon-btn" title="Echo Donjon">&#8593; Echo Donjon</a>
    <div class="lang-dropdown-wrapper">
        <button id="lang-change-btn" class="lang-change-btn" title="Change Language">Language</button>
        <div id="lang-dropdown" class="lang-dropdown-content">
            <button class="lang-option" data-lang="en">EN</button>
            <button class="lang-option" data-lang="fr">FR</button>
            <button class="lang-option" data-lang="es">ES</button>
        </div>
    </div>
    <div class="container">
        <h1>Gaginator</h1>
        <img id="gaginator-img" src="./img/gaginator.png" alt="Gaginator Hero">
        <p class="tagline">Do or Drink!</p>
        <div id="suggestion-box">
            <p id="suggestion-text"></p>
        </div>
        <button id="timer-display" class="timer-display hidden">&#128276; 60s</button>
        <button id="generate-btn">Generate</button>
        <button id="echo-sound-btn" class="echo-sound-btn hidden">&#128276; Echo Donjon</button>
    </div>
    <script src="script.js"></script>
    <script src="../music-player.js" data-start="gaginator.mp3" data-tracks="gaginator/img/gaginator.mp3" data-loop-track defer></script>
</body>

</html>
