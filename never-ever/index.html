<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Never Have I Ever - Hot Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a id="back-to-hub" class="back-to-hub-btn" href="../index.html">&#8592; Back to Hub</a>
    <div class="top-bar">
        <div class="top-bar-center">
            <select id="host-voice-select" class="styled-button top-bar-btn" style="padding: 6px 10px; font-size: 12px;">
                <option value="">Loading voices...</option>
            </select>
        </div>
    </div>
    <div id="players-display" class="players-display">
        <div class="players-controls">
            <button id="host-mute-button" class="styled-button players-ctrl-btn">🔊</button>
            <button id="host-timer-button" class="styled-button players-ctrl-btn">⏱️</button>
            <button id="host-reset-button" class="styled-button players-ctrl-btn">🔄</button>
            <button id="lang-menu-button" class="styled-button players-ctrl-btn" data-i18n-key="languages">Languages</button>
        </div>
        <div id="players-list" class="players-list"></div>
        <div class="players-input-group">
            <input type="text" id="player-name-input" class="player-input" placeholder="Your name..." maxlength="20">
            <button id="add-player-btn" class="styled-button player-add-btn">Add</button>
        </div>
    </div>

    <div id="welcome-overlay" class="welcome-overlay">
        <div class="welcome-card">
            <h1 class="welcome-title">Never Ever</h1>
            <p class="welcome-subtitle" data-i18n-key="welcome_subtitle">Drop the act. Spill the secrets.</p>
            <div class="welcome-input-group">
                <input type="text" id="welcome-player-input" class="welcome-input" placeholder="Your name..." maxlength="20">
                <button id="welcome-add-btn" class="styled-button welcome-btn">Add</button>
            </div>
            <div id="welcome-players-list" class="welcome-players-list"></div>
            <button id="start-game-btn" class="styled-button start-btn" disabled>Start Game</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="spicy-title" data-i18n-key="super_spicy">Super Spicy 🌶️</div>
            <p id="question-text">Never have I ever...</p>
        </div>
        <div id="choices" class="hidden">
            <span class="drink-text" data-i18n-key="drink_or">Truth, drink or</span>
            <button id="do-button" class="styled-button" data-i18n-key="do">Do</button>
        </div>
        <button id="next-question" class="styled-button" data-i18n-key="next_question">Next Question</button>
    </div>

    <div id="action-modal" class="modal hidden">
        <div class="modal-content">
            <p id="action-text"></p>
            <button id="close-modal" class="styled-button" data-i18n-key="close">Close</button>
        </div>
    </div>

    <div id="lang-modal" class="modal hidden">
        <div class="modal-content">
            <button class="lang-select styled-button" data-lang="en">English</button>
            <button class="lang-select styled-button" data-lang="fr">Français</button>
            <button class="lang-select styled-button" data-lang="es">Español</button>
            <button class="lang-select styled-button" data-lang="ar">العربية</button>
            <button class="lang-select styled-button" data-lang="zh">中文</button>
            <button id="close-lang-modal" class="styled-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
