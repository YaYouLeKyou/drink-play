<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Breakout</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .breakout-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px;
        }
        #breakout-canvas {
            display: block;
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: #0a0a1a;
            border: 2px solid #ffd600;
            border-radius: 12px;
        }
        .breakout-info {
            color: #e8f4ff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="breakout-wrap">
        <h2 class="sg-title" style="color:#ffd600;font-family:'Playfair Display',serif;">Breakout</h2>
        <div class="breakout-info" id="breakout-info">Score: 0</div>
        <canvas id="breakout-canvas"></canvas>
    </div>

    <script src="breakout.js"></script>
</body>
</html>
