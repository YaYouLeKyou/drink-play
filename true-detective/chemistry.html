<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Séquençage ADN des 6 Suspects</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <link rel="stylesheet" href="../settings-menu.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="story-chrome.css">
    <style>
        :root {
            --bg-deep: #030307;
            --bg-gradient: radial-gradient(circle at 50% 20%, #100f24 0%, #030307 100%);
            --accent-gold: #f3d98a;
            --accent-blue: #00e1ff;
            --accent-green: #00ff88;
            --accent-pink: #ff007f;
            --accent-purple: #b000ff;
            --text-main: #f0f4f8;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .sg-header {
            background: rgba(8, 8, 14, 0.95) !important;
            border-bottom: 1px solid rgba(0, 225, 255, 0.25);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
        }

        .sg-title {
            text-shadow: 0 0 15px rgba(0, 225, 255, 0.4);
            letter-spacing: 0.05em;
            font-size: 1.1rem !important;
        }

        .sg-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-content {
            width: 100%;
            max-width: 820px;
            height: 100%;
            max-height: 640px;
            background: rgba(10, 12, 20, 0.94);
            border: 1px solid rgba(0, 225, 255, 0.35);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Sélecteur des 6 suspects (par numéro) */
        .suspects-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }

        .suspect-tab {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            font-weight: 600;
        }

        .suspect-tab:hover {
            background: rgba(0, 225, 255, 0.1);
            border-color: var(--accent-blue);
        }

        .suspect-tab.selected {
            background: rgba(0, 225, 255, 0.25);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 225, 255, 0.3);
        }

        .suspect-tab.solved {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* Mission / Indice Actuel */
        .mission-board {
            background: rgba(0, 225, 255, 0.05);
            border-left: 3px solid var(--accent-blue);
            width: 100%;
            padding: 8px 12px;
            border-radius: 0 6px 6px 0;
            box-sizing: border-box;
            font-size: 0.78rem;
        }

        .mission-board b {
            color: var(--accent-gold);
        }

        /* Poste de travail (Éprouvettes) */
        .workstation {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-end;
            margin: 5px 0;
        }

        .tube-station {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .chemistry-tube {
            width: 50px;
            height: 150px;
            border: 3px solid rgba(0, 225, 255, 0.4);
            border-top: none;
            border-radius: 0 0 24px 24px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.6) 100%);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .chemistry-liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            transition: height 0.4s ease, background 0.4s ease;
        }

        .liquid-wave {
            position: absolute;
            top: -4px;
            left: 0;
            width: 200%;
            height: 8px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 120 28" xmlns="http://www.w3.org/2000/svg"><path d="M0 14c30 0 30-14 60-14s30 14 60 14v14H0z" fill="rgba(255,255,255,0.25)"/></svg>');
            animation: wave-animation 3s linear infinite;
        }

        @keyframes wave-animation {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: rise-bubble 1.2s ease-in infinite;
        }

        @keyframes rise-bubble {
            0% { transform: translateY(0) scale(0.4); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-80px) scale(1); opacity: 0; }
        }

        .tube-label {
            margin-top: 6px;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
        }

        /* Panneau des Réactifs Chimiques */
        .reagents-panel {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            background: rgba(5, 7, 12, 0.8);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            box-sizing: border-box;
        }

        .reagent-btn {
            background: rgba(15, 25, 45, 0.9);
            color: var(--text-main);
            border: 1px solid rgba(0, 225, 255, 0.3);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .reagent-btn:hover {
            background: #1a305f;
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .reagent-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Console */
        .lab-console {
            background: rgba(3, 4, 8, 0.95);
            border-left: 4px solid var(--accent-gold);
            width: 100%;
            padding: 8px 12px;
            border-radius: 0 6px 6px 0;
            font-family: 'Special Elite', monospace;
            font-size: 0.78rem;
            color: var(--accent-gold);
            box-sizing: border-box;
            min-height: 38px;
            display: flex;
            align-items: center;
        }

        .lab-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }

        .lab-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .lab-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .lab-btn.primary {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .lab-btn.primary:hover {
            background: rgba(0, 255, 136, 0.3);
        }

        .scanner-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes scan-effect {
            0% { top: 0%; opacity: 1; }
            50% { top: 90%; opacity: 1; }
            100% { top: 0%; opacity: 0; }
        }

        #story-continue-btn {
            position: fixed !important;
            top: 14px !important;
            right: 20px !important;
            /* Annule bottom/left/transform heritees de styles.css (.btn-continue) :
               avec top + bottom definis, le bouton fixed s'etirerait sur toute la
               hauteur de l'ecran et masquerait le mini-jeu. */
            bottom: auto !important;
            left: auto !important;
            transform: none !important;
            max-width: none !important;
            padding: 8px 18px !important;
            font-size: 0.85rem !important;
            font-weight: 700 !important;
            background: rgba(0, 255, 136, 0.12) !important;
            border: 2px solid var(--accent-green) !important;
            border-radius: 8px !important;
            color: var(--accent-green) !important;
            cursor: pointer !important;
            z-index: 100 !important;
            display: none;
             box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        @media (max-width: 768px) {
            #game-content {
                max-height: none !important;
                height: auto !important;
                overflow: visible !important;
                padding: 10px !important;
            }
            .workstation {
                flex-direction: column !important;
                align-items: center !important;
                gap: 10px !important;
            }
            .chemistry-tube {
                height: 120px !important;
            }
            .suspects-selector {
                gap: 4px !important;
            }
            .suspect-tab {
                padding: 4px 10px !important;
                font-size: 0.7rem !important;
            }
        }
        /* Chimie en mode story sur laptop : dialogue compact à gauche,
           plateau de laboratoire centré dans l'espace restant à droite. */
        @media (min-width: 769px) {
            html.td-story-chrome .sg-main {
                min-height: 0;
                overflow: hidden;
            }

            html.td-story-chrome #game-container {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 20px;
                width: 100%;
                height: 100%;
                max-width: 1180px;
                margin: 0 auto;
                box-sizing: border-box;
            }

            html.td-story-chrome #game-container > .td-sc-bar {
                width: 300px;
                max-width: 300px;
                flex: 0 0 300px;
                margin: 0;
            }

            html.td-story-chrome .td-sc-bar-inner {
                align-items: flex-start;
                gap: 9px;
                padding: 9px;
            }

            html.td-story-chrome .td-sc-portrait-frame {
                width: 48px;
                height: 48px;
                border-radius: 8px;
            }

            html.td-story-chrome .td-sc-dialogue-box {
                min-height: 70px;
                max-height: 180px;
                overflow-y: auto;
                padding: 8px 10px;
                font-size: 0.86rem;
                line-height: 1.4;
            }

            html.td-story-chrome #game-content {
                width: min(100%, 820px);
                max-width: 820px;
                height: min(100%, 640px);
                max-height: 640px;
                flex: 0 1 820px;
            }
        }

        @media (max-width: 768px) {
            html.td-story-chrome #game-container {
                flex-direction: column;
                overflow-y: auto;
            }
        }

    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:var(--accent-blue);font-family:'Playfair Display',serif;">🧬 Séquençage ADN : Les 6 Suspects</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>

    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>

    <main class="sg-main">
        <div id="game-container">
            <div id="game-content">
                <div class="scanner-beam" id="scanner"></div>
                
                <!-- Sélecteur des 6 suspects par numéro -->
                <div class="suspects-selector" id="suspects-selector">
                    <button class="suspect-tab selected" onclick="switchSuspect(0)">Suspect 1</button>
                    <button class="suspect-tab" onclick="switchSuspect(1)">Suspect 2</button>
                    <button class="suspect-tab" onclick="switchSuspect(2)">Suspect 3</button>
                    <button class="suspect-tab" onclick="switchSuspect(3)">Suspect 4</button>
                    <button class="suspect-tab" onclick="switchSuspect(4)">Suspect 5</button>
                    <button class="suspect-tab" onclick="switchSuspect(5)">Suspect 6</button>
                </div>

                <!-- Mission / Indice -->
                <div class="mission-board" id="mission-board">
                    🎯 <b>Suspect 1 :</b> Trace prélevée sur la scène de crime. Appliquez le bon protocole chimique (2 réactifs) pour isoler son ADN.
                </div>

                <!-- Poste de travail (2 tubes de mélange + 1 tube résultat) -->
                <div class="workstation">
                    <div class="tube-station">
                        <div class="chemistry-tube">
                            <div class="chemistry-liquid" id="liquid-0" style="height: 50%; background: linear-gradient(to top, #7700ff, #b000ff);">
                                <div class="liquid-wave"></div>
                            </div>
                        </div>
                        <div class="tube-label">Échantillon A</div>
                    </div>

                    <div class="tube-station">
                        <div class="chemistry-tube">
                            <div class="chemistry-liquid" id="liquid-1" style="height: 0%; background: linear-gradient(to top, #0044aa, #00d4ff);">
                                <div class="liquid-wave"></div>
                            </div>
                        </div>
                        <div class="tube-label">Échantillon B</div>
                    </div>

                    <div class="tube-station">
                        <div class="chemistry-tube" style="border-color: var(--accent-gold);">
                            <div class="chemistry-liquid" id="liquid-2" style="height: 0%; background: linear-gradient(to top, #006622, #00ff88);">
                                <div class="liquid-wave"></div>
                            </div>
                        </div>
                        <div class="tube-label" style="color: var(--accent-gold);">ADN Purifié</div>
                    </div>
                </div>

                <!-- Panneau des Réactifs -->
                <div class="reagents-panel">
                    <button class="reagent-btn" onclick="addReagent('lyse')">
                        <span class="reagent-dot" style="background: #00d4ff;"></span> Enzyme de Lyse
                    </button>
                    <button class="reagent-btn" onclick="addReagent('alcohol')">
                        <span class="reagent-dot" style="background: #ff007f;"></span> Alcool Isopropylique
                    </button>
                    <button class="reagent-btn" onclick="addReagent('catalyst')">
                        <span class="reagent-dot" style="background: #00ff88;"></span> Catalyseur UV
                    </button>
                    <button class="reagent-btn" onclick="addReagent('buffer')">
                        <span class="reagent-dot" style="background: #f3d98a;"></span> Solution Tampon
                    </button>
                </div>

                <!-- Console -->
                <div class="lab-console" id="lab-console">
                    👉 Choisissez le premier réactif pour l'Échantillon A du Suspect 1.
                </div>

                <div class="lab-actions">
                    <button class="lab-btn" onclick="resetCurrentSuspect()">🔄 Vider les tubes</button>
                    <button class="lab-btn primary" onclick="validateCurrentSuspect()">🔬 Analyser le Profil</button>
                </div>
            </div>
        </div>
    </main>

    <button id="story-continue-btn" class="btn btn-continue">Continuer l'Enquête</button>

    <script src="minigame-audio.js" data-minigame="chemistry"></script>
    <script src="../settings-menu.js"></script>
    <script src="story-chrome.js"></script>
    <script src="standalone-theme.js"></script>
    <script>
        (function () {
            'use strict';
            if (window.DPSettings && window.DPSettings.init) {
                window.DPSettings.init({
                    showMusicToggle: true, showMusicVolume: true, showNarrationVolume: false,
                    showMuteToggle: false, showGameSection: true, showBackToHub: false,
                    showRestart: false, showRules: false, customButtons: [],
                    onBackToHub: function () { window.location.href = '../true-detective/index.html#minigames'; }
                });
            }

            var $backBtn = document.getElementById('back-to-minigame-btn');
            var $continueBtn = document.getElementById('story-continue-btn');
            var chemistrySolved = false;
            var fromStory = new URLSearchParams(window.location.search).get('story') === '1' || new URLSearchParams(window.location.search).get('mode') === 'story';

            if (fromStory) {
                if ($backBtn) $backBtn.style.display = 'none';
                if ($continueBtn) $continueBtn.style.display = 'block';
            } else {
                if ($backBtn) {
                    $backBtn.textContent = 'Accueil';
                    $backBtn.addEventListener('click', function () {
                        window.location.href = '../true-detective/index.html#minigames';
                    });
                }
            }

            function handleContinueNavigation() {
                try { localStorage.setItem('td_standalone_game_result', JSON.stringify({ type: 'chemistry', won: chemistrySolved, ts: Date.now() })); } catch (e) {} if (window.TDStoryChrome) { window.TDStoryChrome.trigger(chemistrySolved ? 'victory' : 'defeat'); window.TDStoryChrome.reportResult(chemistrySolved); }
                try {
                    var returnRaw = localStorage.getItem('td_standalone_game_return');
                    if (returnRaw) {
                        var rp = JSON.parse(returnRaw);
                        if (rp && rp.returnUrl) { window.location.href = rp.returnUrl; return; }
                    }
                } catch (e) {}
                window.location.href = fromStory ? '../true-detective/index.html?standalone=chemistry' : '../true-detective/index.html#minigames';
            }

            if ($continueBtn) { $continueBtn.addEventListener('click', handleContinueNavigation); }

            var menuHome = document.getElementById('menu-home');
            if (fromStory && menuHome) menuHome.style.display = 'none';
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=chemistry' : '../true-detective/index.html#minigames';
                });
            }

            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (window.DPSettings && window.DPSettings.open) { window.DPSettings.open(); }
                });
            }

            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) { menu.classList.remove('open'); }
                });
            }
        })();

        // Données des 6 suspects numérotés et leurs combinaisons secrètes
        const suspectsData = [
            { name: "Suspect 1", clue: "Trace prélevée sur le comptoir du bar.", solution: ['lyse', 'alcohol'], solved: false },
            { name: "Suspect 2", clue: "Empreinte relevée sur l'insigne de la victime.", solution: ['buffer', 'catalyst'], solved: false },
            { name: "Suspect 3", clue: "Résidu sur le col de chemise.", solution: ['lyse', 'buffer'], solved: false },
            { name: "Suspect 4", clue: "Mèche de cheveux sur le canapé.", solution: ['alcohol', 'catalyst'], solved: false },
            { name: "Suspect 5", clue: "Tache de sueur sur le dossier de contrat.", solution: ['catalyst', 'lyse'], solved: false },
            { name: "Suspect 6", clue: "Sang sous les ongles de la victime.", solution: ['buffer', 'alcohol'], solved: false }
        ];

        let currentSuspectIndex = 0;
        let currentSteps = [];

        function switchSuspect(index) {
            currentSuspectIndex = index;
            currentSteps = [];
            
            document.querySelectorAll('.suspect-tab').forEach((tab, idx) => {
                tab.classList.remove('selected');
                if (idx === index) tab.classList.add('selected');
            });

            const suspect = suspectsData[index];
            document.getElementById('mission-board').innerHTML = `🎯 <b>${suspect.name} :</b> ${suspect.clue} Appliquez 2 réactifs chimiques dans l'ordre requis.`;
            document.getElementById('lab-console').style.color = 'var(--accent-gold)';
            document.getElementById('lab-console').textContent = `👉 Échantillon de ${suspect.name} chargé. Prêt pour le premier réactif.`;

            document.getElementById('liquid-0').style.height = '50%';
            document.getElementById('liquid-1').style.height = '0%';
            document.getElementById('liquid-2').style.height = '0%';
        }

        function addReagent(type) {
            if (currentSteps.length >= 2) {
                document.getElementById('lab-console').textContent = "⚠️ Les deux tubes de mélange sont pleins. Lancez l'analyse !";
                return;
            }

            currentSteps.push(type);
            const tubeIdx = currentSteps.length - 1;
            let liquidEl = document.getElementById(`liquid-${tubeIdx}`);
            liquidEl.style.height = '75%';

            if (type === 'lyse') liquidEl.style.background = 'linear-gradient(to top, #004488, #00d4ff)';
            else if (type === 'alcohol') liquidEl.style.background = 'linear-gradient(to top, #880044, #ff007f)';
            else if (type === 'catalyst') liquidEl.style.background = 'linear-gradient(to top, #006622, #00ff88)';
            else if (type === 'buffer') liquidEl.style.background = 'linear-gradient(to top, #775500, #f3d98a)';

            spawnBubbles(liquidEl.parentElement);
            document.getElementById('lab-console').textContent = `🧪 Réactif ajouté (${currentSteps.length}/2). Ajoutez le suivant ou lancez l'analyse.`;
        }

        function spawnBubbles(tubeElement) {
            for (let i = 0; i < 4; i++) {
                let bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.left = Math.random() * 60 + 20 + '%';
                bubble.style.width = '5px';
                bubble.style.height = '5px';
                tubeElement.appendChild(bubble);
                setTimeout(() => bubble.remove(), 1200);
            }
        }

        function resetCurrentSuspect() {
            currentSteps = [];
            document.getElementById('liquid-0').style.height = '50%';
            document.getElementById('liquid-1').style.height = '0%';
            document.getElementById('liquid-2').style.height = '0%';
            document.getElementById('lab-console').textContent = "🔄 Tubes vidés pour ce suspect. Recommencez.";
        }

        function validateCurrentSuspect() {
            const consoleEl = document.getElementById('lab-console');
            const scanner = document.getElementById('scanner');
            const suspect = suspectsData[currentSuspectIndex];

            if (currentSteps.length < 2) {
                consoleEl.style.color = '#ff4d4d';
                consoleEl.textContent = "❌ Il manque des réactifs ! Ajoutez 2 réactifs avant d'analyser.";
                return;
            }

            scanner.style.animation = 'none';
            scanner.offsetHeight;
            scanner.style.animation = 'scan-effect 1.2s ease-in-out';

            setTimeout(() => {
                let correct = currentSteps[0] === suspect.solution[0] && currentSteps[1] === suspect.solution[1];

                if (correct) {
                    suspect.solved = true;
                    document.querySelectorAll('.suspect-tab')[currentSuspectIndex].classList.add('solved');
                    
                    let dnaLiquid = document.getElementById('liquid-2');
                    dnaLiquid.style.height = '85%';
                    dnaLiquid.style.background = 'linear-gradient(to top, #006622, #00ff88)';

                    consoleEl.style.color = 'var(--accent-green)';
                    consoleEl.textContent = `🎉 SUCCÈS : Profil ADN de ${suspect.name} extrait avec succès !`;

                     let allSolved = suspectsData.every(s => s.solved);
                    if (allSolved) {
                        chemistrySolved = true;
                        document.getElementById('mission-board').innerHTML = "🏆 <b>TOUS LES SUSPECTS ONT ÉTÉ ANALYSÉS !</b> Séquençage complet terminé.";
                        const fromStory = new URLSearchParams(window.location.search).get('story') === '1' || new URLSearchParams(window.location.search).get('mode') === 'story';
                        if (fromStory) {
                            document.getElementById('story-continue-btn').style.display = 'block';
                        }
                    }
                } else {
                    consoleEl.style.color = '#ff4d4d';
                    consoleEl.textContent = "❌ ÉCHEC : Le mélange ne réagit pas correctement. Mauvaise combinaison chimique.";
                }
            }, 1200);
        }
    </script>

    <script>
        (function(){
            function playSfx(name, opts) {
                try { if (parent.TDSfx) parent.TDSfx.play(name, opts); } catch (e) {}
            }
            function playMinigameMusic(type) {
                try { if (parent.TDAudioService && parent.TDAudioService.playMinigameMusic) parent.TDAudioService.playMinigameMusic(type); } catch (e) {}
            }
            window._tdPlaySfx = playSfx;
            window._tdPlayMinigameMusic = playMinigameMusic;
        })();
    </script>
