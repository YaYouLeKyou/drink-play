<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Échec Fatale</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <link rel="stylesheet" href="../settings-menu.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --bg-deep: #05050a;
            --bg-gradient: radial-gradient(circle at 50% 20%, #171426 0%, #05050a 100%);
            --accent-gold: #e5c158;
            --accent-gold-glow: rgba(229, 193, 88, 0.35);
            --accent-blue: #00d4ff;
            --accent-green: #00ff88;
            --text-main: #f0f4f8;
            --board-dark: #3a2518;
            --board-light: #dfccb0;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            /* Optimisation fluidité rendu */
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .sg-header {
            background: rgba(10, 10, 18, 0.9) !important;
            border-bottom: 1px solid rgba(229, 193, 88, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .sg-title {
            text-shadow: 0 2px 10px rgba(229, 193, 88, 0.3);
            letter-spacing: 0.05em;
        }

        .sg-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            min-height: 0;
            box-sizing: border-box;
            transform: translateZ(0);
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- ÉCHIQUIER OPTIMISÉ POUR LA FLUIDITÉ --- */
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: min(76vw, 76vh);
            height: min(76vw, 76vh);
            background: #1f1208;
            border: 6px solid #4a321d;
            border-radius: 8px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8), 
                        inset 0 0 20px rgba(0, 0, 0, 0.7),
                        0 0 20px rgba(229, 193, 88, 0.1);
            transform: translateZ(0);
        }

        .chess-sq {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 5.2vw, 50px);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            /* Transition fluide accélérée par GPU */
            transition: filter 0.1s ease;
            will-change: filter;
        }

        .chess-sq.light {
            background: linear-gradient(135deg, #f2e3cb 0%, var(--board-light) 100%);
        }
        
        .chess-sq.dark {
            background: linear-gradient(135deg, #483020 0%, var(--board-dark) 100%);
        }

        .chess-sq:hover {
            filter: brightness(1.15);
        }

        .chess-sq.selected {
            background: linear-gradient(135deg, #6c4de6 0%, #4832a6) !important;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .chess-sq.possible::after {
            content: '';
            position: absolute;
            width: 32%;
            height: 32%;
            background-color: rgba(0, 212, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.9);
            animation: pulse-glow 1.2s infinite alternate ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .white-piece {
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 255, 255, 0.4);
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }

        .black-piece {
            color: #111118;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.2);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        .chess-piece {
            font-size: min(4.8vw, 44px);
            line-height: 1;
            pointer-events: none;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
        }

        .chess-sq:hover .chess-piece {
            transform: scale(1.08);
        }

        /* Bouton Continuer : fixe en bas au centre de l'ecran, toujours visible.
           Important : ne jamais le placer dans un ancetre avec transform/filter/
           backdrop-filter, sinon cet ancetre devient son bloc conteneur et le
           bouton se retrouve positionne hors de l'ecran (bug corrige). */
        #story-continue-btn {
            position: fixed !important;
            top: auto !important;
            right: auto !important;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            padding: 8px 18px !important;
            font-size: 0.85rem !important;
            font-weight: 700 !important;
            background: rgba(0, 255, 136, 0.12) !important;
            border: 2px solid var(--accent-green) !important;
            border-radius: 8px !important;
            color: var(--accent-green) !important;
            cursor: pointer !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
            font-family: 'Montserrat', sans-serif !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            z-index: 11001 !important;
            white-space: nowrap !important;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
            will-change: transform, box-shadow;
        }
        
        #story-continue-btn:hover {
            background: rgba(0, 255, 136, 0.25) !important;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5) !important;
            transform: translate(-50%, -2px) !important;
        }

        /* Conteneur neutre : le bouton est en position:fixed, ce bloc ne doit
           donc creer ni bloc conteneur (backdrop-filter) ni bande visible. */
        .story-continue-wrap {
            display: none;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0;
            flex-shrink: 0;
            background: transparent;
            border-top: none;
        }

        /* Ecrans peu hauts : on reduit la taille de l'echiquier pour reserver
           la bande du bouton Continuer (fixe en bas) et ne jamais recouvrir
           la derniere rangee. L'echiquier reste carre et jamais tronque. */
        @media (max-height: 700px) {
            .chess-board {
                width: min(76vw, calc(100vh - 200px));
                height: min(76vw, calc(100vh - 200px));
            }
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:var(--accent-gold);font-family:'Playfair Display',serif;">Échec Fatale</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>

    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>

    <main class="sg-main">
        <div id="game-container">
            <div id="game-content"></div>
        </div>
    </main>

    <div id="story-continue-wrap" class="story-continue-wrap">
        <button id="story-continue-btn" class="btn btn-continue">Continuer</button>
    </div>

    <script src="chess-game.js"></script>
    <script src="../settings-menu.js"></script>
    <script src="standalone-theme.js"></script>
    <script src="sfx.js"></script>
    <script src="minigame-audio.js" data-minigame="chess"></script>
    <script>
        (function () {
            'use strict';

            if (window.DPSettings && window.DPSettings.init) {
                window.DPSettings.init({
                    showMusicToggle: true,
                    showMusicVolume: true,
                    showNarrationVolume: false,
                    showMuteToggle: false,
                    showGameSection: true,
                    showBackToHub: false,
                    showRestart: false,
                    showRules: false,
                    customButtons: [],
                    onBackToHub: function () {
                        window.location.href = '../true-detective/index.html#minigames';
                    }
                });
            }

            var $content = document.getElementById('game-content');
            var $backBtn = document.getElementById('back-to-minigame-btn');
            var $continueBtn = document.getElementById('story-continue-btn');
            var fromStory = new URLSearchParams(window.location.search).get('story') === '1';

            if (fromStory) {
                var wrap = document.getElementById('story-continue-wrap');
                if (wrap) wrap.style.display = 'flex';
            } else {
                if ($backBtn) {
                    $backBtn.textContent = 'Accueil';
                    $backBtn.addEventListener('click', function () {
                        window.location.href = '../true-detective/index.html#minigames';
                    });
                }
            }

            function handleContinueNavigation() {
                try { 
                    localStorage.setItem('td_standalone_game_result', JSON.stringify({ type: 'chess', won: chessWon, ts: Date.now() })); 
                } catch (e) {}
                
                try {
                    var returnRaw = localStorage.getItem('td_standalone_game_return');
                    if (returnRaw) {
                        var rp = JSON.parse(returnRaw);
                        if (rp && rp.returnUrl) {
                            window.location.href = rp.returnUrl;
                            return;
                        }
                    }
                } catch (e) {}
                
                window.location.href = fromStory ? '../true-detective/index.html?standalone=chess' : '../true-detective/index.html#minigames';
            }

            if ($continueBtn) {
                $continueBtn.addEventListener('click', handleContinueNavigation);
            }

            var menuHome = document.getElementById('menu-home');
            if (fromStory && menuHome) menuHome.style.display = 'none';
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=chess' : '../true-detective/index.html#minigames';
                });
            }

            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (window.DPSettings && window.DPSettings.open) { 
                        window.DPSettings.open(); 
                    } else { 
                        alert('Paramètres : aucun réglage pour l\'instant.'); 
                    }
                });
            }

            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }

            var cfg = {
                type: 'chess',
                time: 90,
                evidence: 'psychological',
                title: { fr: 'Échec Fatale', en: 'Fatal Chess' },
                desc: { fr: 'Gagnez la partie d\'échecs.', en: 'Win the chess game.' },
                clue: { fr: "Vivienne montre une nervosité inhabituelle.", en: "Vivienne shows unusual nervousness." }
            };

            var chessWon = false;

            // Chargement ultra-fluide synchronisé avec l'affichage de l'écran
            function initChessGame() {
                if (window.TDChessGame && window.TDChessGame.play) {
                    window.TDChessGame.play(cfg, 'fr', function (result) {
                        if (result && result.won) {
                            chessWon = true;
                            var wrap = document.getElementById('story-continue-wrap');
                            if (wrap) wrap.style.display = 'flex';
                        }
                    }, $content);
                } else {
                    requestAnimationFrame(initChessGame);
                }
            }

            requestAnimationFrame(initChessGame);
        })();
    </script>
</body>
</html>
