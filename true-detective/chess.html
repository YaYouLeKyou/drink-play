<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Échecs de Rivalité</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .sg-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 0;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chess-fullscreen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: min(90vw, 90vh);
            height: min(90vw, 90vh);
            background: #2a1d0e;
            border: 4px solid #5c3a21;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }
        .chess-sq {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 6vw, 64px);
            cursor: pointer;
            user-select: none;
        }
        .chess-sq.light {
            background: #f0d9b5;
        }
        .chess-sq.dark {
            background: #b58863;
        }
        .chess-sq.selected {
            background: #7b61ff !important;
        }
        .chess-sq.possible {
            box-shadow: inset 0 0 0 4px rgba(0, 212, 255, 0.6);
        }
        .white-piece {
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .black-piece {
            color: #1a1a1a;
            text-shadow: 0 2px 4px rgba(255,255,255,0.3);
        }
        .chess-piece {
            font-size: min(5vw, 48px);
            line-height: 1;
            pointer-events: none;
            animation: pieceEnter 0.35s ease-out;
        }
        .chess-interro-history {
            font-size: 0.85rem;
            color: #a0c0d0;
            border-top: 1px solid rgba(0, 255, 255, 0.15);
            padding-top: 4px;
            margin-top: 4px;
        }
        .chess-interro-question {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 10px;
            padding: 10px 14px;
            color: #e0f7ff;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            text-align: left;
        }
        .chess-interro-question:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: rgba(0, 255, 255, 0.5);
        }
        .chess-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .chess-overlay-msg {
            background: #1a1a2e;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 24px 32px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }
        #story-continue-btn {
            position: fixed !important;
            top: 20px !important;
            right: 20px !important;
            padding: 8px 16px !important;
            font-size: 0.85rem !important;
            font-weight: 700 !important;
            background: rgba(0, 255, 136, 0.15) !important;
            border: 2px solid #00ff88 !important;
            border-radius: 8px !important;
            color: #00ff88 !important;
            cursor: pointer !important;
            transition: all 0.2s ease !important;
            font-family: 'Montserrat', sans-serif !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            z-index: 100 !important;
            white-space: nowrap !important;
        }
        #story-continue-btn:hover {
            background: rgba(0, 255, 136, 0.3) !important;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4) !important;
        }
        .story-continue-wrap {
            display: none;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-align: center;
            flex-shrink: 0;
            margin-top: 16px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
        }
        #game-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: min(80vw, 80vh);
            height: min(80vw, 80vh);
            background: #2a1d0e;
            border: 4px solid #5c3a21;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:#d4af37;font-family:'Playfair Display',serif;">Échecs de Rivalité</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>
    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>
    <main class="sg-main">
        <div id="game-container">
            <div id="game-content" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
        </div>
    </main>
    <div id="story-continue-wrap" class="story-continue-wrap">
        <button id="story-continue-btn" class="btn btn-continue">Continuer</button>
    </div>

    <script src="chess-game.js"></script>
    <script src="../settings-menu.js"></script>
    <script>
        (function () {
            'use strict';

            if (window.DPSettings && window.DPSettings.init) {
                window.DPSettings.init({
                    showMusicToggle: true,
                    showMusicVolume: true,
                    showNarrationVolume: false,
                    showMuteToggle: false,
                    showGameSection: true,
                    showBackToHub: false,
                    showRestart: false,
                    showRules: false,
                    customButtons: [],
                    onBackToHub: function () {
                        window.location.href = '../true-detective/index.html#minigames';
                    }
                });
            }

            var $content = document.getElementById('game-content');
            var $backBtn = document.getElementById('back-to-minigame-btn');
            var $continueBtn = document.getElementById('story-continue-btn');
            var fromStory = new URLSearchParams(window.location.search).get('story') === '1';

            if (fromStory) {
            var wrap = document.getElementById('story-continue-wrap');
            if (wrap) wrap.style.display = 'flex';
            } else {
                $backBtn.textContent = 'Accueil';
                $backBtn.addEventListener('click', function () {
                    window.location.href = '../true-detective/index.html#minigames';
                });
            }

            $continueBtn.addEventListener('click', function () {
                try { localStorage.setItem('td_standalone_game_result', JSON.stringify({ type: 'chess', won: true, ts: Date.now() })); } catch (e) {}
                try {
                    var returnRaw = localStorage.getItem('td_standalone_game_return');
                    if (returnRaw) {
                        var rp = JSON.parse(returnRaw);
                        if (rp && rp.returnUrl) {
                            window.location.href = rp.returnUrl;
                            return;
                        }
                    }
                } catch (e) {}
                window.location.href = '../true-detective/index.html?standalone=chess';
            });

            var menuHome = document.getElementById('menu-home');
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=chess' : '../true-detective/index.html#minigames';
                });
            }
            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (window.DPSettings && window.DPSettings.open) { window.DPSettings.open(); } else { alert('Paramètres : aucun réglage pour l\'instant.'); }
                });
            }

            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }

            var cfg = {
                type: 'chess',
                time: 90,
                evidence: 'psychological',
                title: { fr: 'Échecs de Rivalité', en: 'Chess Duel' },
                desc: { fr: 'Gagnez la partie d\'échecs.', en: 'Win the chess game.' },
                clue: { fr: "Vivienne montre une nervosité inhabituelle.", en: "Vivienne shows unusual nervousness." }
            };

            if (window.TDChessGame && window.TDChessGame.play) {
                window.TDChessGame.play(cfg, 'fr', function (result) {
                    if (result && result.won) {
                        var wrap = document.getElementById('story-continue-wrap');
                        if (wrap) wrap.style.display = 'flex';
                    }
                }, $content);
            } else {
                $content.innerHTML = '<div style="color:#fff;font-family:Montserrat,sans-serif;text-align:center;padding:24px;">Erreur : le jeu d\'échecs n\'a pas pu être chargé. Vérifiez que chess-game.js est bien présent.</div>';
            }
        })();
    </script>
</body>
</html>
