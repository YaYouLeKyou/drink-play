<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Detective - Échecs contre Lady Vivienne</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Special+Elite&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chess.css">
</head>
<body>
    <div id="chess-app">
        <header class="chess-header">
            <button id="back-to-game-btn" class="btn btn-back">← Retour à l'enquête</button>
            <h1 class="chess-title">Échecs contre Lady Vivienne</h1>
            <div class="chess-status-bar">
                <span id="chess-turn" class="chess-turn">Tour : Vous (Blancs)</span>
                <span id="chess-timer" class="chess-timer">⏱️ 10:00</span>
            </div>
        </header>

        <main class="chess-main">
            <div class="chess-board-container" id="board-container">
                <div id="chess-board" class="chess-board"></div>
                <div id="chess-overlay" class="chess-overlay hidden">
                    <div class="chess-overlay-content">
                        <h2 id="chess-result" class="chess-result"></h2>
                        <p id="chess-clue-text" class="chess-clue-text"></p>
                        <button id="chess-continue-btn" class="btn btn-primary">Continuer l'enquête</button>
                    </div>
                </div>
            </div>

            <aside class="chess-sidebar">
                <div class="chess-character">
                    <img id="chess-char-img" class="chess-char-img" src="" alt="Lady Vivienne">
                    <div class="chess-char-info">
                        <h3 id="chess-char-name" class="chess-char-name">Lady Vivienne</h3>
                        <span id="chess-char-role" class="chess-char-role">Suspect</span>
                    </div>
                </div>

                <div class="chess-dialogue-area">
                    <div id="chess-dialogue" class="chess-dialogue"></div>
                </div>

                <div class="chess-clues-panel">
                    <h3 class="chess-clues-title">Indices découverts</h3>
                    <ul id="chess-clues-list" class="chess-clues-list"></ul>
                </div>

                <button id="chess-skip-btn" class="btn btn-secondary">Passer</button>
            </aside>
        </main>
    </div>

    <script src="chess.js"></script>
</body>
</html>
