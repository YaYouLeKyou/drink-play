<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Le Coffre-fort</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Special+Elite&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <link rel="stylesheet" href="../settings-menu.css">
    <style>
        :root {
            --bg-dark: #070712;
            --panel-bg: rgba(13, 13, 26, 0.95);
            --accent-orange: #ff6b00;
            --accent-blue: #00d4ff;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --text-main: #e8f4ff;
            --text-secondary: #a0c0d0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 10%, #1a162b 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .coffre-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Corps du coffre */
        .coffre-safe {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(135deg, #222233 0%, #11111a 100%);
            border-radius: 16px;
            border: 5px solid #3a3a5c;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            gap: 20px;
            position: relative;
        }

        .coffre-brand {
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            color: var(--accent-orange);
            text-transform: uppercase;
            text-align: center;
        }

        /* Cadran / Écran de combinaison à 4 rouleaux */
        .combination-pad {
            display: flex;
            gap: 10px;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 14px;
            border-radius: 12px;
            border: 2px solid rgba(0, 212, 255, 0.2);
        }

        .digit-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .digit-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            width: 44px;
            height: 32px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .digit-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }

        .digit-display {
            width: 50px;
            height: 60px;
            background: #05050a;
            border: 2px solid #333355;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Special Elite', monospace;
            font-size: 2rem;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
            user-select: none;
        }

        /* Poignée du coffre */
        .coffre-handle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .coffre-handle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #555577 0%, #222233 100%);
            border: 4px solid #777799;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.2s ease;
        }

        .coffre-handle::after {
            content: '';
            width: 14px;
            height: 40px;
            background: #aaaacc;
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }

        .coffre-handle.locked:hover {
            border-color: var(--accent-blue);
        }

        .coffre-handle.unlocked {
            transform: rotate(90deg);
            border-color: var(--accent-green);
        }

        .coffre-handle-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Messages et indices */
        .coffre-hint {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 400px;
            line-height: 1.4;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .coffre-status {
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            min-height: 24px;
        }

        .coffre-btn {
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            color: var(--accent-blue);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .coffre-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .btn-continue {
            position: fixed;
            top: 15px;
            right: 20px;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid var(--accent-green);
            border-radius: 8px;
            color: var(--accent-green);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            z-index: 100;
        }
        .btn-continue:hover {
            background: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }        @media (max-width: 768px) {
            .coffre-board {
                padding: 10px !important;
            }
            .coffre-numpad {
                gap: 6px !important;
            }
            .coffre-key {
                min-height: 44px !important;
                padding: 10px 0 !important;
                font-size: 1.1rem !important;
            }
            .coffre-display {
                font-size: 1.2rem !important;
            }
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:var(--accent-orange);font-family:'Playfair Display',serif;">Le Coffre-fort</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>
    
    <button id="story-continue-btn" class="btn-continue" style="display:none;">Continuer</button>
    
    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>

    <main class="sg-main">
        <div class="coffre-wrap">
            <div class="coffre-safe" id="coffre-container">
                <div class="coffre-brand">SÉCURITÉ BLINDÉE - MADIER</div>
                
                <div class="combination-pad">
                    <div class="digit-box">
                        <button class="digit-btn" data-index="0" data-dir="up">▲</button>
                        <div class="digit-display" id="digit-0">0</div>
                        <button class="digit-btn" data-index="0" data-dir="down">▼</button>
                    </div>
                    <div class="digit-box">
                        <button class="digit-btn" data-index="1" data-dir="up">▲</button>
                        <div class="digit-display" id="digit-1">0</div>
                        <button class="digit-btn" data-index="1" data-dir="down">▼</button>
                    </div>
                    <div class="digit-box">
                        <button class="digit-btn" data-index="2" data-dir="up">▲</button>
                        <div class="digit-display" id="digit-2">0</div>
                        <button class="digit-btn" data-index="2" data-dir="down">▼</button>
                    </div>
                    <div class="digit-box">
                        <button class="digit-btn" data-index="3" data-dir="up">▲</button>
                        <div class="digit-display" id="digit-3">0</div>
                        <button class="digit-btn" data-index="3" data-dir="down">▼</button>
                    </div>
                </div>

                <div class="coffre-handle-container">
                    <div class="coffre-handle locked" id="coffre-handle" title="Actionner la poignée"></div>
                    <span class="coffre-handle-label" id="handle-label">Poignée verrouillée</span>
                </div>
            </div>

            <div class="coffre-hint" id="coffre-hint">
                La combinaison de la montre (1-9-8-1) est gravée dans votre mémoire. Utilisez les flèches pour régler les chiffres, puis actionnez la poignée pour ouvrir le coffre.
            </div>

            <div class="coffre-status" id="coffre-status"></div>

            <button class="coffre-btn" id="validate-safe">Vérifier la combinaison</button>
        </div>
    </main>

    <script src="minigames.js"></script>
    <script src="../settings-menu.js"></script>
    <script src="standalone-theme.js"></script>
    <script src="sfx.js"></script>
    <script src="minigame-audio.js" data-minigame="coffre_code"></script>
    <script>
        (function () {
            'use strict';

            var CORRECT_CODE = '1981';
            var currentDigits = [0, 0, 0, 0]; // Initialisé à 0000
            var isUnlocked = false;

            // Paramètres d'état de l'histoire
            function getUrlParam(name) {
                var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
                return m ? decodeURIComponent(m[1]) : null;
            }

            var safeState = getUrlParam('state') || (getUrlParam('story') === '1' ? 'empty' : 'clue');
            var suspectId = getUrlParam('suspect') || '';

            // Read story config for custom state (e.g. from phases.js minigame config)
            try {
                var cfgRaw = localStorage.getItem('td_standalone_game_config');
                if (cfgRaw) {
                    var cfg = JSON.parse(cfgRaw);
                    if (cfg && cfg.type === 'coffre_code' && cfg.state) {
                        safeState = cfg.state;
                    }
                }
            } catch (e) {}

            var STATE_MESSAGES = {
                empty: 'Le coffre est **VIDÉ**. Mais le compartiment caché derrière le mur — découvert grâce au puzzle — renferme les vrais documents !',
                clue: 'Le coffre contient des documents compromettants.',
                forced: "Le coffre a été forcé. L'intrus a tout emporté."
            };

            var SUSPECT_STATES = {
                protecteur: 'clue',
                'femme-fatale': 'empty',
                seducteur: 'clue',
                suspect: 'forced',
                marginal: 'empty',
                criminel: 'clue'
            };

            if (typeof SUSPECT_STATES[suspectId] !== 'undefined') {
                safeState = SUSPECT_STATES[suspectId];
            }

            // Éléments DOM
            var hintEl = document.getElementById('coffre-hint');
            var statusEl = document.getElementById('coffre-status');
            var validateBtn = document.getElementById('validate-safe');
            var handleEl = document.getElementById('coffre-handle');
            var handleLabel = document.getElementById('handle-label');
            var containerEl = document.getElementById('coffre-container');

            if (hintEl) {
                hintEl.textContent = STATE_MESSAGES[safeState] || STATE_MESSAGES.clue;
            }

            // Gestion des boutons digitaux (+ / -)
            var digitButtons = document.querySelectorAll('.digit-btn');
            digitButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    if (isUnlocked) return;
                    var index = parseInt(btn.getAttribute('data-index'), 10);
                    var dir = btn.getAttribute('data-dir');

                    if (dir === 'up') {
                        currentDigits[index] = (currentDigits[index] + 1) % 10;
                    } else {
                        currentDigits[index] = (currentDigits[index] - 1 + 10) % 10;
                    }

                    var displayEl = document.getElementById('digit-' + index);
                    if (displayEl) {
                        displayEl.textContent = currentDigits[index];
                    }
                });
            });

            function attemptOpen() {
                if (isUnlocked) return;

                var enteredCode = currentDigits.join('');

                if (enteredCode === CORRECT_CODE) {
                    unlockSafe();
                    playSfx('success');
                } else {
                    // Erreur de code
                    playSfx('fail');
                    containerEl.classList.add('shake');
                    setTimeout(function() {
                        containerEl.classList.remove('shake');
                    }, 400);

                    statusEl.innerHTML = '<span style="color:var(--accent-red);">Combinaison incorrecte. Le mécanisme bloque.</span>';
                }
            }

            function unlockSafe() {
                isUnlocked = true;
                handleEl.classList.remove('locked');
                handleEl.classList.add('unlocked');
                handleLabel.textContent = 'Coffre ouvert';
                statusEl.innerHTML = '<span style="color:var(--accent-green); font-weight:700;">Verrouillage sauté ! ' + (STATE_MESSAGES[safeState] || '') + '</span>';
                validateBtn.textContent = 'Terminer l\'investigation';
                validateBtn.style.borderColor = 'var(--accent-green)';
                validateBtn.style.color = 'var(--accent-green)';

                // Sauvegarde du résultat
                try {
                    var clueText = "Le coffre-fort est vide, mais le compartiment caché derrière le mur renferme les vrais documents : contrats falsifiés, registres de versements, et une lettre signée Wexford.";
                    localStorage.setItem('td_standalone_game_result', JSON.stringify({
                        type: 'coffre_code', won: true, state: safeState, suspect: suspectId, clue: clueText, ts: Date.now()
                    }));
                    var journal = JSON.parse(localStorage.getItem('td_journal') || '{}');
                    journal.coffreState = safeState;
                    journal.coffreSuspect = suspectId;
                    journal.coffreOpened = true;
                    localStorage.setItem('td_journal', JSON.stringify(journal));
                } catch (e) {}

                var storyBtn = document.getElementById('story-continue-btn');
                if (storyBtn) storyBtn.style.display = 'inline-block';
            }

            if (validateBtn) {
                validateBtn.addEventListener('click', function() {
                    if (isUnlocked) {
                        proceedToNext();
                    } else {
                        attemptOpen();
                    }
                });
            }

            if (handleEl) {
                handleEl.addEventListener('click', function() {
                    if (!isUnlocked) {
                        attemptOpen();
                    }
                });
            }

            function proceedToNext() {
                var fromStory = new URLSearchParams(window.location.search).get('story') === '1';
                try {
                    var resultRaw = localStorage.getItem('td_standalone_game_result');
                    if (!resultRaw) {
                        localStorage.setItem('td_standalone_game_result', JSON.stringify({
                            type: 'coffre_code', won: false, ts: Date.now()
                        }));
                    }
                } catch (e) {}
                try {
                    var returnRaw = localStorage.getItem('td_standalone_game_return');
                    if (returnRaw) {
                        var rp = JSON.parse(returnRaw);
                        if (rp && rp.returnUrl) {
                            window.location.href = rp.returnUrl;
                            return;
                        }
                    }
                } catch (e) {}
                window.location.href = fromStory ? '../true-detective/index.html?standalone=coffre_code' : '../true-detective/index.html#minigames';
            }

            if (window.DPSettings && window.DPSettings.init) {
                window.DPSettings.init({
                    showMusicToggle: false, showMusicVolume: false, showNarrationVolume: false,
                    showMuteToggle: false, showGameSection: true, showBackToHub: false, showRestart: false, showRules: false,
                    onBackToHub: function () { window.location.href = '../true-detective/index.html#minigames'; }
                });
            }

            // Gestion de la navigation et du menu hamburger
            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }

            var fromStory = new URLSearchParams(window.location.search).get('story') === '1';
            var backBtn = document.getElementById('back-to-minigame-btn');
            var storyContinueBtn = document.getElementById('story-continue-btn');

            if (fromStory) {
                if (backBtn) backBtn.style.display = 'none';
                if (storyContinueBtn) {
                    storyContinueBtn.style.display = 'inline-block';
                    storyContinueBtn.addEventListener('click', proceedToNext);
                }
            } else {
                if (storyContinueBtn) storyContinueBtn.style.display = 'none';
                if (backBtn) {
                    backBtn.textContent = 'Accueil';
                    backBtn.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html#minigames';
                    });
                }
            }

            var menuHome = document.getElementById('menu-home');
            if (fromStory && menuHome) menuHome.style.display = 'none';
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=coffre_code' : '../true-detective/index.html#minigames';
                });
            }

            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    if (window.DPSettings && window.DPSettings.open) { window.DPSettings.open(); } else { alert('Paramètres'); }
                });
            }
        })();
    </script>
</body>
</html>
