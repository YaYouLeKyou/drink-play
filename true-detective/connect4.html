<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Puissance 4</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .connect4-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .connect4-board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background: #00d4ff;
            padding: 8px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
        .connect4-cell {
            aspect-ratio: 1;
            background: #0c1018;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s ease;
            min-width: 36px;
            min-height: 36px;
        }
        .connect4-cell:hover {
            background: #1a2030;
        }
        .connect4-cell.red {
            background: #ff006e;
        }
        .connect4-cell.yellow {
            background: #ffd600;
        }
        .connect4-info {
            text-align: center;
            color: #e8f4ff;
            font-size: 1rem;
            font-weight: 600;
        }
        .connect4-btn {
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }
        .connect4-btn:hover {
            background: rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:#00d4ff;font-family:'Playfair Display',serif;">Puissance 4</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>
    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>
    <main class="sg-main">
        <div class="connect4-wrap">
            <div class="connect4-info" id="connect4-status">Tour: Rouge</div>
            <div class="connect4-board" id="connect4-board"></div>
            <button class="connect4-btn" id="connect4-reset">Nouvelle partie</button>
        </div>
    </main>

    <script src="connect4.js"></script>
    <script>
        (function () {
            'use strict';
            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }
            var backBtn = document.getElementById('back-to-minigame-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = '../true-detective/index.html';
                });
            }
            var menuHome = document.getElementById('menu-home');
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = '../true-detective/index.html';
                });
            }
            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    alert('Paramètres : aucun réglage pour l\'instant.');
                });
            }
        })();
    </script>
</body>
</html>
