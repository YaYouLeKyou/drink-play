<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Le Cryptogramme</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .crypto-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 24px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }
        .crypto-note {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            font-family: 'Special Elite', cursive;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            position: relative;
        }
        .crypto-note::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="none" width="100" height="100"/></svg>');
            opacity: 0.03;
            pointer-events: none;
        }
        .crypto-letter {
            display: inline-block;
            width: 28px;
            text-align: center;
            font-weight: 700;
            color: #ffd600;
            text-shadow: 0 0 6px rgba(255, 214, 0, 0.4);
        }
        .crypto-letter.solved {
            color: var(--neon-cyan);
            text-shadow: 0 0 6px rgba(0, 212, 255, 0.4);
        }
        .crypto-inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }
        .crypto-input {
            width: 36px;
            height: 40px;
            text-align: center;
            font-size: 1.1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            color: var(--neon-cyan);
            caret-color: var(--neon-cyan);
            text-transform: uppercase;
        }
        .crypto-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
            outline: none;
        }
        .crypto-btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .crypto-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        .crypto-hint {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:#00d4ff;font-family:'Playfair Display',serif;">Le Cryptogramme</h2>
        <button id="continue-btn" class="btn btn-primary always-active">Continuer</button>
    </header>
    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-back">
            <span class="menu-icon">←</span>
            <span>Retour à l'enquête</span>
        </button>
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-continue">
            <span class="menu-icon">▶</span>
            <span>Continuer</span>
        </button>
    </nav>
    <main class="sg-main">
        <div class="crypto-wrap">
            <div class="crypto-note" id="crypto-note"></div>
            <div class="crypto-inputs" id="crypto-inputs"></div>
            <button class="crypto-btn" id="validate-crypto">Déchiffrer</button>
            <div class="crypto-hint">
                Remplacez chaque lettre par la bonne lettre de l'alphabet. Le message parle d'un engagement...
            </div>
        </div>
    </main>

    <script src="minigames.js"></script>
    <script>
        (function () {
            'use strict';
            var SOLUTION = 'HALEENGAGEKRANE';
            var encrypted = '';
            var mapping = {};
            var inputs = [];

            function caesarShift(text, shift) {
                var result = '';
                for (var i = 0; i < text.length; i++) {
                    var c = text[i];
                    if (c >= 'A' && c <= 'Z') {
                        result += String.fromCharCode(((c.charCodeAt(0) - 65 + shift) % 26) + 65);
                    } else {
                        result += c;
                    }
                }
                return result;
            }

            function init() {
                var shift = 7;
                encrypted = caesarShift(SOLUTION, shift);

                var note = document.getElementById('crypto-note');
                var inputsContainer = document.getElementById('crypto-inputs');
                if (note) {
                    note.innerHTML = '';
                    for (var i = 0; i < encrypted.length; i++) {
                        var span = document.createElement('span');
                        span.className = 'crypto-letter';
                        span.textContent = encrypted[i];
                        span.dataset.index = i;
                        note.appendChild(span);
                    }
                }

                if (inputsContainer) {
                    inputsContainer.innerHTML = '';
                    for (var j = 0; j < SOLUTION.length; j++) {
                        var input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = 1;
                        input.className = 'crypto-input';
                        input.dataset.index = j;
                        input.addEventListener('input', function (e, idx) {
                            var val = e.target.value.toUpperCase();
                            e.target.value = val;
                            updateLetter(idx, val);
                            if (val && idx < SOLUTION.length - 1) {
                                inputs[idx + 1].focus();
                            }
                        });
                        input.addEventListener('keydown', function (e, idx) {
                            if (e.key === 'Backspace' && e.target.value === '' && idx > 0) {
                                inputs[idx - 1].focus();
                            }
                        });
                        inputsContainer.appendChild(input);
                        inputs.push(input);
                    }
                }

                var validateBtn = document.getElementById('validate-crypto');
                if (validateBtn) {
                    validateBtn.addEventListener('click', checkSolution);
                }

                setupControls();
            }

            function updateLetter(idx, letter) {
                var note = document.getElementById('crypto-note');
                if (!note) return;
                var span = note.querySelector('[data-index="' + idx + '"]');
                if (span) {
                    if (letter && letter === SOLUTION[idx]) {
                        span.classList.add('solved');
                        span.textContent = letter;
                    } else if (letter) {
                        span.classList.remove('solved');
                        span.textContent = letter;
                    } else {
                        span.classList.remove('solved');
                        span.textContent = encrypted[idx];
                    }
                }
            }

            function checkSolution() {
                var entered = inputs.map(function (el) { return el ? el.value.toUpperCase() : ''; }).join('');
                if (entered === SOLUTION) {
                    try {
                        localStorage.setItem('td_standalone_game_result', JSON.stringify({
                            type: 'cryptogramme',
                            won: true,
                            ts: Date.now()
                        }));
                    } catch (e) {}
                    window.location.href = '../true-detective/index.html?standalone=cryptogramme';
                } else {
                    inputs.forEach(function (el) {
                        if (el) {
                            el.style.borderColor = '#ff006e';
                            el.style.color = '#ff006e';
                            setTimeout(function () {
                                el.style.borderColor = '';
                                el.style.color = '';
                            }, 800);
                        }
                    });
                }
            }

            function setupControls() {
                var hamburgerBtn = document.getElementById('hamburger-btn');
                var menu = document.getElementById('hamburger-menu');
                if (hamburgerBtn && menu) {
                    hamburgerBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        menu.classList.toggle('open');
                    });
                    document.addEventListener('click', function (e) {
                        if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                            menu.classList.remove('open');
                        }
                    });
                }
                var menuBack = document.getElementById('menu-back');
                if (menuBack) {
                    menuBack.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html';
                    });
                }
                var menuHome = document.getElementById('menu-home');
                if (menuHome) {
                    menuHome.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html';
                    });
                }
                var menuContinue = document.getElementById('menu-continue');
                if (menuContinue) {
                    menuContinue.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html';
                    });
                }
                var continueBtn = document.getElementById('continue-btn');
                if (continueBtn) {
                    continueBtn.addEventListener('click', function () {
                        window.location.href = '../true-detective/index.html';
                    });
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
