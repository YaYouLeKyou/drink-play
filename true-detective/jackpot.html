<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Jackpot</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .jackpot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .jackpot-machine {
            background: #0c1018;
            border: 2px solid #00d4ff;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .jackpot-reels {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .jackpot-reel {
            width: 80px;
            height: 80px;
            background: #06080d;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #fff;
            transition: transform 0.1s ease;
        }
        .jackpot-reel.spinning {
            animation: spin 0.5s linear infinite;
        }
        @keyframes spin {
            0% { transform: translateY(-10px); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(-10px); }
        }
        .jackpot-btn {
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 700;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .jackpot-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        .jackpot-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .jackpot-info {
            text-align: center;
            color: #8aa3b8;
            font-size: 0.9rem;
        }
        .jackpot-spins {
            color: #ffd600;
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:#ffd600;font-family:'Playfair Display',serif;">Jackpot</h2>
        <button id="continue-btn" class="btn btn-primary always-active">Continuer</button>
    </header>
    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-back">
            <span class="menu-icon">←</span>
            <span>Retour à l'enquête</span>
        </button>
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        </nav>
    <main class="sg-main">
        <div class="jackpot-wrap">
            <div class="jackpot-machine">
                <div class="jackpot-reels">
                    <div class="jackpot-reel" id="reel1">🍒</div>
                    <div class="jackpot-reel" id="reel2">🍒</div>
                    <div class="jackpot-reel" id="reel3">🍒</div>
                </div>
                <div class="jackpot-info">
                    <div class="jackpot-spins" id="jackpot-spins">Spins: 6</div>
                </div>
                <button class="jackpot-btn" id="jackpot-btn">JOUER</button>
            </div>
        </div>
    </main>

    <script src="jackpot.js"></script>
    <script>
        (function () {
            'use strict';
            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }
            var menuBack = document.getElementById('menu-back');
            if (menuBack) {
                menuBack.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = '../true-detective/index.html';
                });
            }
            var menuHome = document.getElementById('menu-home');
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = '../true-detective/index.html';
                });
            }
            var menuContinue = document.getElementById('menu-continue');
            if (menuContinue) {
                menuContinue.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = '../true-detective/index.html';
                });
            }
            var continueBtn = document.getElementById('continue-btn');
            if (continueBtn) {
                continueBtn.addEventListener('click', function () {
                    window.location.href = '../true-detective/index.html';
                });
            }
        })();
    </script>
</body>
</html>
