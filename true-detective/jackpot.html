<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Jackpot</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .jackpot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .jackpot-machine {
            background: #0c1018;
            border: 2px solid #00d4ff;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .jackpot-reels {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .jackpot-reel {
            width: 80px;
            height: 80px;
            background: #06080d;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #fff;
            transition: transform 0.1s ease;
        }
        .jackpot-reel.spinning {
            animation: spin 0.5s linear infinite;
        }
        @keyframes spin {
            0% { transform: translateY(-10px); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(-10px); }
        }
        .jackpot-btn {
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 700;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .jackpot-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        .jackpot-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .jackpot-info {
            text-align: center;
            color: #8aa3b8;
            font-size: 0.9rem;
        }
        .jackpot-spins {
            color: #ffd600;
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:#ffd600;font-family:'Playfair Display',serif;">Jackpot</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>
    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>
    <main class="sg-main">
        <div class="jackpot-wrap">
            <div class="jackpot-machine">
                <div class="jackpot-reels">
                    <div class="jackpot-reel" id="reel1">🍒</div>
                    <div class="jackpot-reel" id="reel2">🍒</div>
                    <div class="jackpot-reel" id="reel3">🍒</div>
                </div>
                <div class="jackpot-info">
                    <div class="jackpot-spins" id="jackpot-spins">Spins: 6</div>
                </div>
                <button class="jackpot-btn" id="jackpot-btn">JOUER</button>
            </div>
        </div>
    </main>

    <script src="jackpot.js"></script>
    <script src="../settings-menu.js"></script>
    <script src="standalone-theme.js"></script>
    <script>
        (function () {
            'use strict';

            if (window.DPSettings && window.DPSettings.init) {
                window.DPSettings.init({
                    showMusicToggle: true,
                    showMusicVolume: true,
                    showNarrationVolume: false,
                    showMuteToggle: false,
                    showGameSection: true,
                    showBackToHub: false,
                    showRestart: false,
                    showRules: false,
                    customButtons: [],
                    onBackToHub: function () {
                        window.location.href = '../true-detective/index.html#minigames';
                    }
                });
            }
            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }
            var backBtn = document.getElementById('back-to-minigame-btn');
            var fromStory = new URLSearchParams(window.location.search).get('story') === '1';
            if (fromStory) {
                if (backBtn) backBtn.style.display = 'none';
                var continueBtn = document.createElement('button');
                continueBtn.id = 'story-continue-btn';
                continueBtn.className = 'btn btn-continue';
                continueBtn.textContent = 'Continuer';
                continueBtn.style.cssText = 'margin-left:8px;padding:10px 20px;font-size:0.9rem;font-weight:700;background:rgba(0,255,136,0.15);border:2px solid #00ff88;border-radius:8px;color:#00ff88;cursor:pointer;font-family:Montserrat,sans-serif;text-transform:uppercase;letter-spacing:0.05em;';
                continueBtn.addEventListener('click', function () {
                    try { localStorage.setItem('td_standalone_game_result', JSON.stringify({ type: 'jackpot', won: true, ts: Date.now() })); } catch (e) {}
                    try {
                        var returnRaw = localStorage.getItem('td_standalone_game_return');
                        if (returnRaw) {
                            var rp = JSON.parse(returnRaw);
                            if (rp && rp.returnUrl) {
                                window.location.href = rp.returnUrl;
                                return;
                            }
                        }
                    } catch (e) {}
                    var fromStory = new URLSearchParams(window.location.search).get('story') === '1';
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=jackpot' : '../true-detective/index.html#minigames';
                });
                var header = document.querySelector('.sg-header');
                if (header) header.appendChild(continueBtn);
            } else {
                if (backBtn) {
                    backBtn.textContent = 'Accueil';
                    backBtn.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html#minigames';
                    });
                }
            }
            var menuHome = document.getElementById('menu-home');
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=jackpot' : '../true-detective/index.html#minigames';
                });
            }
            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    if (window.DPSettings && window.DPSettings.open) { window.DPSettings.open(); } else { alert('Paramètres : aucun réglage pour l\'instant.'); }
                });
            }
        })();
    </script>
</body>
</html>
