<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Memory</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Special+Elite&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .memory-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .memory-header {
            width: 100%;
            text-align: center;
            background: rgba(12, 16, 24, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .memory-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: #f0d890;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            margin: 0;
        }
        .memory-stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .memory-stat {
            font-size: 0.9rem;
            color: #00d4ff;
            font-weight: 600;
        }
        .memory-grid {
            display: grid;
            gap: 8px;
            justify-content: center;
            align-content: center;
            width: 100%;
        }
        .memory-card {
            aspect-ratio: 3 / 4;
            background: #1a1a3a;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease;
            transform-style: preserve-3d;
            min-height: 70px;
        }
        .memory-card:hover {
            border-color: #ff00ff;
            transform: translateY(-2px);
        }
        .memory-card.flipped {
            background: #0a0a1a;
            border-color: #ff00ff;
        }
        .memory-card.matched {
            opacity: 0.5;
            cursor: default;
            border-color: #39ff14;
        }
        .memory-card-front,
        .memory-card-back {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            border-radius: 6px;
        }
        .memory-card-front {
            background: transparent;
            color: #00d4ff;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .memory-card-back {
            flex-direction: column;
            gap: 4px;
            padding: 4px;
        }
        .memory-card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .memory-card-label {
            font-size: 0.65rem;
            color: #a0c0d0;
            text-align: center;
            line-height: 1.1;
            margin-top: 2px;
        }
        .memory-dialogue {
            width: 100%;
            background: rgba(12, 16, 24, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #e8f4ff;
            font-size: 0.9rem;
            font-style: italic;
        }
        @media (max-width: 480px) {
            .memory-grid {
                gap: 6px;
            }
            .memory-card {
                font-size: 1.5rem;
                border-radius: 6px;
            }
            .memory-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="memory-app">
        <div class="memory-wrap">
            <div class="memory-header">
                <h2 class="memory-title" id="memory-title">Jeu de mémoire</h2>
                <div class="memory-stats">
                    <div class="memory-stat" id="memory-timer">00:00</div>
                    <div class="memory-stat" id="memory-pairs">Paires: 0/0</div>
                </div>
            </div>
            <div class="memory-grid" id="memory-grid"></div>
            <div class="memory-dialogue" id="memory-dialogue"></div>
        </div>
    </div>

    <script src="memory.js"></script>
</body>
</html>
