<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Pong</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .pong-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px;
        }
        #pong-canvas {
            display: block;
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: #0a0a1a;
            border: 2px solid #00d4ff;
            border-radius: 12px;
        }
        .pong-info {
            color: #e8f4ff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="pong-wrap">
        <h2 class="sg-title" style="color:#00d4ff;font-family:'Playfair Display',serif;">Pong</h2>
        <div class="pong-info" id="pong-info">Joueur: 0 | IA: 0</div>
        <canvas id="pong-canvas"></canvas>
    </div>

    <script src="pong.js"></script>
</body>
</html>
