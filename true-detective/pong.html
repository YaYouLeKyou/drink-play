<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Pong</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Special+Elite&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        :root {
            --bg-dark: #070712;
            --accent-blue: #00d4ff;
            --accent-green: #00ff88;
            --accent-orange: #ff6b00;
            --text-main: #e8f4ff;
            --text-secondary: #a0c0d0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 10%, #1a162b 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .pong-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .pong-header-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 0 4px;
        }

        #pong-canvas {
            display: block;
            width: 100%;
            max-width: 600px;
            height: 380px;
            background: #060611;
            border: 3px solid var(--accent-blue);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.8);
            touch-action: none;
            cursor: pointer;
        }

        .pong-instructions {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 600px;
        }

        .btn-continue {
            position: fixed;
            top: 15px;
            right: 20px;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid var(--accent-green);
            border-radius: 8px;
            color: var(--accent-green);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            z-index: 100;
        }
        .btn-continue:hover {
            background: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:var(--accent-blue);font-family:'Playfair Display',serif;">Pong Investigation</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>
    
    <button id="story-continue-btn" class="btn-continue" style="display:none;">Continuer</button>

    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>

    <main class="sg-main">
        <div class="pong-wrap">
            <div class="pong-header-info">
                <span id="level-indicator">Niveau 1</span>
                <span id="pong-score">Joueur: 0 | IA: 0</span>
            </div>
            <canvas id="pong-canvas"></canvas>
            <div class="pong-instructions" id="pong-instructions">
                Glissez sur l'écran ou utilisez les flèches <b>HAUT / BAS</b> pour contrôler votre raquette. Premier à 5 points gagne !
            </div>
        </div>
    </main>

    <script src="../settings-menu.js"></script>
    <script src="standalone-theme.js"></script>
    <script>
        (function () {
            'use strict';

            // Récupération du niveau (1 à 3)
            function getLevel() {
                var level = parseInt(new URLSearchParams(window.location.search).get('level') || '1', 10);
                if (isNaN(level) || level < 1) level = 1;
                if (level > 3) level = 3;
                return level;
            }

            var currentLevel = getLevel();
            var levelEl = document.getElementById('level-indicator');
            if (levelEl) levelEl.textContent = 'Niveau ' + currentLevel;

            var canvas = document.getElementById('pong-canvas');
            var ctx = canvas.getContext('2d');
            var scoreEl = document.getElementById('pong-score');
            var instructionsEl = document.getElementById('pong-instructions');

            // Dimensions logiques du canvas
            canvas.width = 600;
            canvas.height = 380;

            // Paramètres du jeu
            var player = { x: 20, y: canvas.height / 2 - 35, width: 12, height: 75, score: 0, dy: 0 };
            var ai = { x: canvas.width - 32, y: canvas.height / 2 - 35, width: 12, height: 75, score: 0 };
            var ball = { x: canvas.width / 2, y: canvas.height / 2, radius: 8, speedX: 4 + currentLevel, speedY: 3, maxSpeed: 10 };

            var particles = [];
            var gameStarted = false;
            var gameOver = false;
            var winningScore = 5;

            // Difficulté selon le niveau
            var aiSpeed = 2.5 + currentLevel * 1.2;

            // Contrôles Clavier
            var keys = { up: false, down: false };
            window.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowUp' || e.key === 'z' || e.key === 'Z') { keys.up = true; startGame(); e.preventDefault(); }
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { keys.down = true; startGame(); e.preventDefault(); }
            });
            window.addEventListener('keyup', function(e) {
                if (e.key === 'ArrowUp' || e.key === 'z' || e.key === 'Z') keys.up = false;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
            });

            // Contrôles Tactiles & Souris fluides
            function handleTouchMove(clientY) {
                var rect = canvas.getBoundingClientRect();
                var root = document.documentElement;
                var mouseY = clientY - rect.top - (window.pageYOffset || root.scrollTop);
                player.y = mouseY - player.height / 2;
                // Limites
                if (player.y < 0) player.y = 0;
                if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
                startGame();
            }

            canvas.addEventListener('mousemove', function(e) {
                handleTouchMove(e.clientY);
            });

            canvas.addEventListener('touchmove', function(e) {
                if (e.touches.length > 0) {
                    handleTouchMove(e.touches[0].clientY);
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('click', function() {
                startGame();
            });

            function startGame() {
                if (!gameStarted && !gameOver) {
                    gameStarted = true;
                    if (instructionsEl) instructionsEl.textContent = "Partie en cours... Restez concentré !";
                }
            }

            // Génération de particules lors des impacts
            function createParticles(x, y, color) {
                for (var i = 0; i < 8; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        radius: Math.random() * 3 + 1,
                        color: color,
                        alpha: 1
                    });
                }
            }

            // Réinitialisation de la balle après un point
            function resetBall(scorer) {
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.speedX = (scorer === 'player' ? 1 : -1) * (4 + currentLevel);
                ball.speedY = (Math.random() * 4 - 2);
            }

            // Boucle principale de mise à jour
            function update() {
                if (!gameStarted || gameOver) return;

                // Mouvement joueur clavier
                if (keys.up) player.y -= 6;
                if (keys.down) player.y += 6;
                if (player.y < 0) player.y = 0;
                if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;

                // Mouvement IA intelligent
                var aiCenter = ai.y + ai.height / 2;
                if (aiCenter < ball.y - 10) {
                    ai.y += aiSpeed;
                } else if (aiCenter > ball.y + 10) {
                    ai.y -= aiSpeed;
                }
                if (ai.y < 0) ai.y = 0;
                if (ai.y > canvas.height - ai.height) ai.y = canvas.height - ai.height;

                // Mouvement de la balle
                ball.x += ball.speedX;
                ball.y += ball.speedY;

                // Rebond murs haut / bas
                if (ball.y - ball.radius < 0) {
                    ball.y = ball.radius;
                    ball.speedY *= -1;
                    createParticles(ball.x, ball.y, '#00d4ff');
                } else if (ball.y + ball.radius > canvas.height) {
                    ball.y = canvas.height - ball.radius;
                    ball.speedY *= -1;
                    createParticles(ball.x, ball.y, '#00d4ff');
                }

                // Collision Raquette Joueur
                if (
                    ball.x - ball.radius < player.x + player.width &&
                    ball.x + ball.radius > player.x &&
                    ball.y > player.y &&
                    ball.y < player.y + player.height
                ) {
                    ball.x = player.x + player.width + ball.radius;
                    var hitPoint = ball.y - (player.y + player.height / 2);
                    ball.speedX *= -1.05; // Accélération progressive
                    ball.speedY = hitPoint * 0.25;
                    // Limiter vitesse maximale
                    if (Math.abs(ball.speedX) > ball.maxSpeed) ball.speedX = ball.speedX > 0 ? ball.maxSpeed : -ball.maxSpeed;
                    createParticles(ball.x, ball.y, '#00ff88');
                }

                // Collision Raquette IA
                if (
                    ball.x + ball.radius > ai.x &&
                    ball.x - ball.radius < ai.x + ai.width &&
                    ball.y > ai.y &&
                    ball.y < ai.y + ai.height
                ) {
                    ball.x = ai.x - ball.radius;
                    var hitPoint = ball.y - (ai.y + ai.height / 2);
                    ball.speedX *= -1.05;
                    ball.speedY = hitPoint * 0.25;
                    if (Math.abs(ball.speedX) > ball.maxSpeed) ball.speedX = ball.speedX > 0 ? ball.maxSpeed : -ball.maxSpeed;
                    createParticles(ball.x, ball.y, '#ff6b00');
                }

                // Gestion des buts (Points)
                if (ball.x < 0) {
                    ai.score++;
                    updateScoreText();
                    checkGameOver();
                    resetBall('ai');
                } else if (ball.x > canvas.width) {
                    player.score++;
                    updateScoreText();
                    checkGameOver();
                    resetBall('player');
                }

                // Mise à jour des particules
                for (var i = particles.length - 1; i >= 0; i--) {
                    var p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.03;
                    if (p.alpha <= 0) particles.splice(i, 1);
                }
            }

            function updateScoreText() {
                if (scoreEl) scoreEl.textContent = 'Joueur: ' + player.score + ' | IA: ' + ai.score;
            }

            function checkGameOver() {
                if (player.score >= winningScore || ai.score >= winningScore) {
                    gameOver = true;
                    var won = player.score > ai.score;
                    
                    if (instructionsEl) {
                        instructionsEl.innerHTML = won ? 
                            '<span style="color:var(--accent-green);font-weight:700;">Victoire ! Vous avez dominé l\'échange.</span>' : 
                            '<span style="color:var(--accent-orange);font-weight:700;">Défaite... L\'IA a été plus forte.</span>';
                    }

                    // Sauvegarde du résultat
                    try {
                        localStorage.setItem('td_standalone_game_result', JSON.stringify({
                            type: 'pong', won: won, scorePlayer: player.score, scoreAi: ai.score, ts: Date.now()
                        }));
                    } catch (e) {}

                    var storyBtn = document.getElementById('story-continue-btn');
                    if (storyBtn) storyBtn.style.display = 'inline-block';
                }
            }

            // Boucle de rendu graphique
            function draw() {
                // Fond du terrain
                ctx.fillStyle = '#060611';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Ligne centrale pointillée
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);

                // Dessin de la raquette du joueur (Vert néon)
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00ff88';
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(player.x, player.y, player.width, player.height);

                // Dessin de la raquette IA (Orange néon)
                ctx.shadowColor = '#ff6b00';
                ctx.fillStyle = '#ff6b00';
                ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

                // Dessin de la balle (Bleu néon)
                ctx.shadowColor = '#00d4ff';
                ctx.fillStyle = '#00d4ff';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();

                // Dessin des particules
                ctx.shadowBlur = 0;
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // Écran de démarrage / Pause
                if (!gameStarted && !gameOver) {
                    ctx.fillStyle = 'rgba(6, 6, 17, 0.75)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#e8f4ff';
                    ctx.font = 'bold 1.3rem Montserrat, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Touchez l\'écran ou bougez pour commencer', canvas.width / 2, canvas.height / 2);
                }
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();

            // Gestion des boutons de navigation et paramètres
            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }

            var fromStory = new URLSearchParams(window.location.search).get('story') === '1';
            var backBtn = document.getElementById('back-to-minigame-btn');
            var storyContinueBtn = document.getElementById('story-continue-btn');

            function proceedToNext() {
                try {
                    var returnRaw = localStorage.getItem('td_standalone_game_return');
                    if (returnRaw) {
                        var rp = JSON.parse(returnRaw);
                        if (rp && rp.returnUrl) {
                            window.location.href = rp.returnUrl;
                            return;
                        }
                    }
                } catch (e) {}
                window.location.href = fromStory ? '../true-detective/index.html?standalone=pong' : '../true-detective/index.html#minigames';
            }

            if (fromStory) {
                if (backBtn) backBtn.style.display = 'none';
                if (storyContinueBtn) {
                    storyContinueBtn.addEventListener('click', proceedToNext);
                }
            } else {
                if (storyContinueBtn) storyContinueBtn.style.display = 'none';
                if (backBtn) {
                    backBtn.textContent = 'Accueil';
                    backBtn.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html#minigames';
                    });
                }
            }

            var menuHome = document.getElementById('menu-home');
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=pong' : '../true-detective/index.html#minigames';
                });
            }

            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    if (window.DPSettings && window.DPSettings.open) { window.DPSettings.open(); } else { alert('Paramètres'); }
                });
            }
        })();
    </script>
</body>
</html>
