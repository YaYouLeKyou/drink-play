<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Le Puzzle</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .puzzle-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .puzzle-canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 700px;
            aspect-ratio: 4/3;
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        #puzzle-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #puzzle-canvas:active {
            cursor: grabbing;
        }
        .puzzle-status {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-align: center;
        }
        .puzzle-hint {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }
        .puzzle-btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .puzzle-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        .puzzle-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:#ff6b00;font-family:'Playfair Display',serif;">Le Puzzle</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
        <button id="story-continue-btn" class="btn btn-continue" style="display:none;margin-left:8px;">Continuer</button>
    </header>
    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>
    <main class="sg-main">
        <div class="puzzle-wrap">
            <div class="puzzle-canvas-wrap">
                <canvas id="puzzle-canvas"></canvas>
            </div>
            <div class="puzzle-status" id="puzzle-status">Faites glisser les formes dans les alvéoles correspondantes.</div>
            <button class="puzzle-btn" id="reset-puzzle-btn" disabled>Réinitialiser</button>
            <div class="puzzle-hint">
                Chaque forme possède une alvéole unique. Faites glisser une forme vers son emplacement : elle s\'y encastre quand elle est bien placée.
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="minigames.js"></script>
    <script src="standalone-game.js"></script>
    <script>
        (function () {
            'use strict';

            if (typeof Matter === 'undefined') {
                document.getElementById('puzzle-status').textContent = 'Erreur : Matter.js non chargé.';
                return;
            }

            var canvas = document.getElementById('puzzle-canvas');
            var statusEl = document.getElementById('puzzle-status');
            var resetBtn = document.getElementById('reset-puzzle-btn');

            var W = 700;
            var H = 525;
            canvas.width = W;
            canvas.height = H;

            var Engine = Matter.Engine,
                Render = Matter.Render,
                Runner = Matter.Runner,
                Bodies = Matter.Bodies,
                Body = Matter.Body,
                Composite = Matter.Composite,
                Events = Matter.Events,
                Mouse = Matter.Mouse,
                MouseConstraint = Matter.MouseConstraint,
                Vector = Matter.Vector;

            var engine = Engine.create({ gravity: { x: 0, y: 0.8 } });
            var world = engine.world;

            var containerX = W / 2;
            var containerY = H / 2;
            var containerW = 460;
            var containerH = 340;
            var containerTop = containerY - containerH / 2;
            var containerLeft = containerX - containerW / 2;

            var shapes = [];
            var slots = [];
            var fitted = {};
            var solved = false;

            var slotDefs = [
                { id: 'circle', type: 'circle', x: containerLeft + 100, y: containerTop + 80, size: 42, color: '#ff006e' },
                { id: 'square', type: 'square', x: containerLeft + 220, y: containerTop + 80, size: 44, color: '#ffbe0b' },
                { id: 'triangle', type: 'triangle', x: containerLeft + 340, y: containerTop + 80, size: 48, color: '#00d4ff' },
                { id: 'rect', type: 'rect', x: containerLeft + 100, y: containerTop + 200, w: 80, h: 50, color: '#8338ec' },
                { id: 'pentagon', type: 'polygon', x: containerLeft + 240, y: containerTop + 200, sides: 5, size: 44, color: '#06d6a0' },
                { id: 'hexagon', type: 'polygon', x: containerLeft + 380, y: containerTop + 200, sides: 6, size: 44, color: '#ef476f' }
            ];

            var paletteY = containerTop + containerH + 70;
            var paletteX = containerLeft + 40;
            var paletteGap = 110;

            function createSlotBody(def) {
                var body;
                if (def.type === 'circle') {
                    body = Bodies.circle(def.x, def.y, def.size, { isStatic: true, isSensor: true, label: 'slot-' + def.id, plugin: { slotId: def.id } });
                } else if (def.type === 'square') {
                    body = Bodies.rectangle(def.x, def.y, def.size * 2, def.size * 2, { isStatic: true, isSensor: true, label: 'slot-' + def.id, plugin: { slotId: def.id } });
                } else if (def.type === 'rect') {
                    body = Bodies.rectangle(def.x, def.y, def.w, def.h, { isStatic: true, isSensor: true, label: 'slot-' + def.id, plugin: { slotId: def.id } });
                } else if (def.type === 'triangle') {
                    body = Bodies.polygon(def.x, def.y, 3, def.size, { isStatic: true, isSensor: true, label: 'slot-' + def.id, plugin: { slotId: def.id } });
                } else if (def.type === 'polygon') {
                    body = Bodies.polygon(def.x, def.y, def.sides, def.size, { isStatic: true, isSensor: true, label: 'slot-' + def.id, plugin: { slotId: def.id } });
                }
                if (body) {
                    body.plugin = body.plugin || {};
                    body.plugin.slotId = def.id;
                    body.plugin.slotColor = def.color;
                }
                return body;
            }

            function createShapeBody(def, index) {
                var x = paletteX + index * paletteGap;
                var body;
                if (def.type === 'circle') {
                    body = Bodies.circle(x, paletteY, def.size, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'shape-' + def.id, plugin: { shapeId: def.id, color: def.color } });
                } else if (def.type === 'square') {
                    body = Bodies.rectangle(x, paletteY, def.size * 2, def.size * 2, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'shape-' + def.id, plugin: { shapeId: def.id, color: def.color } });
                } else if (def.type === 'rect') {
                    body = Bodies.rectangle(x, paletteY, def.w, def.h, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'shape-' + def.id, plugin: { shapeId: def.id, color: def.color } });
                } else if (def.type === 'triangle') {
                    body = Bodies.polygon(x, paletteY, 3, def.size, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'shape-' + def.id, plugin: { shapeId: def.id, color: def.color } });
                } else if (def.type === 'polygon') {
                    body = Bodies.polygon(x, paletteY, def.sides, def.size, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'shape-' + def.id, plugin: { shapeId: def.id, color: def.color } });
                }
                if (body) {
                    body.plugin = body.plugin || {};
                    body.plugin.shapeId = def.id;
                    body.plugin.color = def.color;
                    body.plugin.origX = x;
                    body.plugin.origY = paletteY;
                }
                return body;
            }

            function initPuzzle() {
                Composite.clear(world);
                shapes = [];
                slots = [];
                fitted = {};
                solved = false;

                var wallOpts = { isStatic: true, render: { fillStyle: '#1a1a3a' } };
                Composite.add(world, [
                    Bodies.rectangle(W / 2, H + 25, W, 50, wallOpts),
                    Bodies.rectangle(-25, H / 2, 50, H, wallOpts),
                    Bodies.rectangle(W + 25, H / 2, 50, H, wallOpts)
                ]);

                slotDefs.forEach(function (def) {
                    var slot = createSlotBody(def);
                    if (slot) {
                        slots.push(slot);
                        Composite.add(world, slot);
                    }
                });

                slotDefs.forEach(function (def, i) {
                    var shape = createShapeBody(def, i);
                    if (shape) {
                        shapes.push(shape);
                        Composite.add(world, shape);
                    }
                });

                var mouse = Mouse.create(canvas);
                var mouseConstraint = MouseConstraint.create(engine, {
                    mouse: mouse,
                    constraint: {
                        stiffness: 0.2,
                        render: { visible: false }
                    }
                });
                Composite.add(world, mouseConstraint);

                Events.on(engine, 'afterUpdate', function () {
                    if (solved) return;
                    shapes.forEach(function (shape) {
                        if (!shape || !shape.plugin) return;
                        if (fitted[shape.plugin.shapeId]) return;
                        slots.forEach(function (slot) {
                            if (!slot || !slot.plugin) return;
                            if (shape.plugin.shapeId !== slot.plugin.slotId) return;
                            var dx = shape.position.x - slot.position.x;
                            var dy = shape.position.y - slot.position.y;
                            var dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 18) {
                                Body.setPosition(shape, { x: slot.position.x, y: slot.position.y });
                                Body.setAngle(shape, slot.angle || 0);
                                Body.setVelocity(shape, { x: 0, y: 0 });
                                Body.setAngularVelocity(shape, 0);
                                shape.isSensor = true;
                                fitted[shape.plugin.shapeId] = true;
                                statusEl.textContent = 'Forme encastrée : ' + shape.plugin.shapeId + '. Reste : ' + (slotDefs.length - Object.keys(fitted).length);
                                if (Object.keys(fitted).length === slotDefs.length) {
                                    solved = true;
                                    statusEl.innerHTML = '<span style="color:#00ff88">Puzzle résolu ! Le message caché est révélé : HALE ENGAGE KRANE.</span>';
                                    resetBtn.disabled = false;
                                    try {
                                        localStorage.setItem('td_standalone_game_result', JSON.stringify({
                                            type: 'puzzle',
                                            won: true,
                                            ts: Date.now()
                                        }));
                                    } catch (e) {}
                                }
                            }
                        });
                    });
                });

                statusEl.textContent = 'Faites glisser les formes dans les alvéoles correspondantes.';
                resetBtn.disabled = true;
            }

            function drawBackground(ctx) {
                ctx.fillStyle = '#0d0d1a';
                ctx.fillRect(0, 0, W, H);

                ctx.strokeStyle = '#1f1f3a';
                ctx.lineWidth = 2;
                ctx.strokeRect(containerLeft, containerTop, containerW, containerH);

                ctx.fillStyle = 'rgba(255,255,255,0.03)';
                ctx.fillRect(containerLeft, containerTop, containerW, containerH);

                slotDefs.forEach(function (def) {
                    ctx.save();
                    ctx.translate(def.x, def.y);
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.strokeStyle = def.color;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    if (def.type === 'circle') {
                        ctx.beginPath();
                        ctx.arc(0, 0, def.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else if (def.type === 'square') {
                        ctx.fillRect(-def.size, -def.size, def.size * 2, def.size * 2);
                        ctx.strokeRect(-def.size, -def.size, def.size * 2, def.size * 2);
                    } else if (def.type === 'rect') {
                        ctx.fillRect(-def.w / 2, -def.h / 2, def.w, def.h);
                        ctx.strokeRect(-def.w / 2, -def.h / 2, def.w, def.h);
                    } else if (def.type === 'triangle') {
                        ctx.beginPath();
                        for (var i = 0; i < 3; i++) {
                            var angle = (i * 2 * Math.PI / 3) - Math.PI / 2;
                            var px = Math.cos(angle) * def.size;
                            var py = Math.sin(angle) * def.size;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else if (def.type === 'polygon') {
                        ctx.beginPath();
                        for (var j = 0; j < def.sides; j++) {
                            var a = (j * 2 * Math.PI / def.sides) - Math.PI / 2;
                            var sx = Math.cos(a) * def.size;
                            var sy = Math.sin(a) * def.size;
                            if (j === 0) ctx.moveTo(sx, sy);
                            else ctx.lineTo(sx, sy);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                ctx.fillStyle = '#a0c0d0';
                ctx.font = '12px Montserrat, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Palette', W / 2, paletteY - 30);
            }

            function renderLoop() {
                var ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, W, H);
                drawBackground(ctx);

                shapes.forEach(function (body) {
                    if (!body) return;
                    var pos = body.position;
                    var angle = body.angle;
                    var color = (body.plugin && body.plugin.color) ? body.plugin.color : '#00d4ff';
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(angle);
                    ctx.fillStyle = color;
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 10;
                    var verts = body.vertices;
                    if (verts && verts.length) {
                        ctx.beginPath();
                        ctx.moveTo(verts[0].x - pos.x, verts[0].y - pos.y);
                        for (var i = 1; i < verts.length; i++) {
                            ctx.lineTo(verts[i].x - pos.x, verts[i].y - pos.y);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                if (!solved) {
                    Engine.update(engine, 1000 / 60);
                }

                requestAnimationFrame(renderLoop);
            }

            resetBtn.addEventListener('click', function () {
                if (solved) return;
                initPuzzle();
                statusEl.textContent = 'Puzzle réinitialisé.';
            });

            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }

            var backBtn = document.getElementById('back-to-minigame-btn');
            var storyContinueBtn = document.getElementById('story-continue-btn');
            var fromStory = new URLSearchParams(window.location.search).get('story') === '1';
            if (fromStory) {
                if (backBtn) backBtn.style.display = 'none';
                if (storyContinueBtn) {
                    storyContinueBtn.style.display = 'inline-block';
                    storyContinueBtn.addEventListener('click', function () {
                        try { localStorage.setItem('td_standalone_game_result', JSON.stringify({ type: 'puzzle', won: true, ts: Date.now() })); } catch (e) {}
                        try {
                            var returnRaw = localStorage.getItem('td_standalone_game_return');
                            if (returnRaw) {
                                var rp = JSON.parse(returnRaw);
                                if (rp && rp.returnUrl) {
                                    window.location.href = rp.returnUrl;
                                    return;
                                }
                            }
                        } catch (e) {}
                        window.location.href = '../true-detective/index.html?standalone=puzzle';
                    });
                }
            } else {
                if (backBtn) {
                    backBtn.textContent = 'Accueil';
                    backBtn.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html#minigames';
                    });
                }
            }

            var menuHome = document.getElementById('menu-home');
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=puzzle' : '../true-detective/index.html#minigames';
                });
            }
            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    alert('Paramètres : aucun réglage pour l\'instant.');
                });
            }

            initPuzzle();
            renderLoop();
        })();
    </script>
</body>
</html>
