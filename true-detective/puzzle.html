<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Le Puzzle</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <style>
        .puzzle-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .puzzle-canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            background: #0d0d1a;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        #puzzle-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #puzzle-canvas:active {
            cursor: grabbing;
        }
        .puzzle-status {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-align: center;
        }
        .puzzle-hint {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }
        .puzzle-btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .puzzle-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        .puzzle-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-continue {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid #00ff88;
            border-radius: 8px;
            color: #00ff88;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            z-index: 100;
        }
        .btn-continue:hover {
            background: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h2 class="sg-title" style="color:#ff6b00;font-family:'Playfair Display',serif;">Le Puzzle</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>
    <button id="story-continue-btn" class="btn btn-continue" style="display:none;">Continuer</button>
    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>
    <main class="sg-main">
        <div class="puzzle-wrap">
            <div class="puzzle-canvas-wrap">
                <canvas id="puzzle-canvas"></canvas>
            </div>
            <div class="puzzle-status" id="puzzle-status">Assemblez les pièces pour reconstituer la forme finale.</div>
            <button class="puzzle-btn" id="reset-puzzle-btn" disabled>Réinitialiser</button>
            <div class="puzzle-hint">
                Faites glisser et pivoter les pièces. Quand une pièce est proche de sa place, elle se snap automatiquement. Reconstruisez la forme complète.
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="minigames.js"></script>
    <script src="standalone-game.js"></script>
    <script src="../settings-menu.js"></script>
    <script>
        (function () {
            'use strict';

            if (window.DPSettings && window.DPSettings.init) {
                window.DPSettings.init({
                    showMusicToggle: true,
                    showMusicVolume: true,
                    showNarrationVolume: false,
                    showMuteToggle: false,
                    showGameSection: true,
                    showBackToHub: false,
                    showRestart: false,
                    showRules: false,
                    customButtons: [],
                    onBackToHub: function () {
                        window.location.href = '../true-detective/index.html#minigames';
                    }
                });
            }

            if (typeof Matter === 'undefined') {
                document.getElementById('puzzle-status').textContent = 'Erreur : Matter.js non chargé.';
                return;
            }

            var canvas = document.getElementById('puzzle-canvas');
            var statusEl = document.getElementById('puzzle-status');
            var resetBtn = document.getElementById('reset-puzzle-btn');

            var W = 800;
            var H = 600;
            canvas.width = W;
            canvas.height = H;

            var Engine = Matter.Engine,
                Render = Matter.Render,
                Runner = Matter.Runner,
                Bodies = Matter.Bodies,
                Body = Matter.Body,
                Composite = Matter.Composite,
                Events = Matter.Events,
                Mouse = Matter.Mouse,
                MouseConstraint = Matter.MouseConstraint,
                Vector = Matter.Vector;

            var engine = Engine.create({ gravity: { x: 0, y: 0.6 } });
            var world = engine.world;

            var pieces = [];
            var slots = [];
            var fitted = {};
            var solved = false;
            var snapDistance = 25;
            var snapAngle = Math.PI / 8;

            function createFinalShape() {
                var cx = W / 2;
                var cy = H / 2;
                var w = 320;
                var h = 240;
                var parts = [
                    Bodies.rectangle(cx, cy, w, h, { isStatic: true, isSensor: true, label: 'final-shape', plugin: { partOfFinal: true } }),
                    Bodies.rectangle(cx - w/2 - 20, cy, 40, h, { isStatic: true, isSensor: true, label: 'final-left', plugin: { partOfFinal: true } }),
                    Bodies.rectangle(cx + w/2 + 20, cy, 40, h, { isStatic: true, isSensor: true, label: 'final-right', plugin: { partOfFinal: true } }),
                    Bodies.rectangle(cx, cy - h/2 - 20, w + 80, 40, { isStatic: true, isSensor: true, label: 'final-top', plugin: { partOfFinal: true } }),
                    Bodies.rectangle(cx, cy + h/2 + 20, w + 80, 40, { isStatic: true, isSensor: true, label: 'final-bottom', plugin: { partOfFinal: true } })
                ];
                return parts;
            }

            var pieceDefs = [
                { id: 'rect1', type: 'rect', x: 180, y: 150, w: 120, h: 80, color: '#ff006e', targetX: W/2 - 100, targetY: H/2 - 60, targetAngle: 0 },
                { id: 'rect2', type: 'rect', x: 340, y: 150, w: 120, h: 80, color: '#ffbe0b', targetX: W/2 + 100, targetY: H/2 - 60, targetAngle: 0 },
                { id: 'rect3', type: 'rect', x: 180, y: 300, w: 120, h: 80, color: '#00d4ff', targetX: W/2 - 100, targetY: H/2 + 60, targetAngle: 0 },
                { id: 'rect4', type: 'rect', x: 340, y: 300, w: 120, h: 80, color: '#8338ec', targetX: W/2 + 100, targetY: H/2 + 60, targetAngle: 0 },
                { id: 'center', type: 'square', x: 500, y: 220, size: 50, color: '#06d6a0', targetX: W/2, targetY: H/2, targetAngle: 0 },
                { id: 'top', type: 'rect', x: 600, y: 120, w: 140, h: 40, color: '#ef476f', targetX: W/2, targetY: H/2 - 100, targetAngle: 0 },
                { id: 'bottom', type: 'rect', x: 600, y: 380, w: 140, h: 40, color: '#ffd600', targetX: W/2, targetY: H/2 + 100, targetAngle: 0 }
            ];

            function createPieceBody(def, index) {
                var x = 100 + (index % 4) * 160;
                var y = 80 + Math.floor(index / 4) * 140;
                var body;
                if (def.type === 'circle') {
                    body = Bodies.circle(x, y, def.size, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'piece-' + def.id, plugin: { pieceId: def.id, color: def.color, targetX: def.targetX, targetY: def.targetY, targetAngle: def.targetAngle } });
                } else if (def.type === 'square') {
                    body = Bodies.rectangle(x, y, def.size * 2, def.size * 2, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'piece-' + def.id, plugin: { pieceId: def.id, color: def.color, targetX: def.targetX, targetY: def.targetY, targetAngle: def.targetAngle } });
                } else if (def.type === 'rect') {
                    body = Bodies.rectangle(x, y, def.w, def.h, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'piece-' + def.id, plugin: { pieceId: def.id, color: def.color, targetX: def.targetX, targetY: def.targetY, targetAngle: def.targetAngle } });
                } else if (def.type === 'triangle') {
                    body = Bodies.polygon(x, y, 3, def.size, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'piece-' + def.id, plugin: { pieceId: def.id, color: def.color, targetX: def.targetX, targetY: def.targetY, targetAngle: def.targetAngle } });
                } else if (def.type === 'polygon') {
                    body = Bodies.polygon(x, y, def.sides, def.size, { restitution: 0.2, friction: 0.5, density: 0.002, label: 'piece-' + def.id, plugin: { pieceId: def.id, color: def.color, targetX: def.targetX, targetY: def.targetY, targetAngle: def.targetAngle } });
                }
                if (body) {
                    body.plugin = body.plugin || {};
                    body.plugin.pieceId = def.id;
                    body.plugin.color = def.color;
                    body.plugin.targetX = def.targetX;
                    body.plugin.targetY = def.targetY;
                    body.plugin.targetAngle = def.targetAngle || 0;
                }
                return body;
            }

            function initPuzzle() {
                Composite.clear(world);
                pieces = [];
                slots = [];
                fitted = {};
                solved = false;

                var wallOpts = { isStatic: true, render: { fillStyle: '#1a1a3a' } };
                Composite.add(world, [
                    Bodies.rectangle(W / 2, H + 25, W, 50, wallOpts),
                    Bodies.rectangle(-25, H / 2, 50, H, wallOpts),
                    Bodies.rectangle(W + 25, H / 2, 50, H, wallOpts)
                ]);

                var finalParts = createFinalShape();
                finalParts.forEach(function (part) {
                    Composite.add(world, part);
                });

                pieceDefs.forEach(function (def, i) {
                    var piece = createPieceBody(def, i);
                    if (piece) {
                        pieces.push(piece);
                        Composite.add(world, piece);
                    }
                });

                var mouse = Mouse.create(canvas);
                var mouseConstraint = MouseConstraint.create(engine, {
                    mouse: mouse,
                    constraint: {
                        stiffness: 0.2,
                        render: { visible: false }
                    }
                });
                Composite.add(world, mouseConstraint);

                Events.on(engine, 'afterUpdate', function () {
                    if (solved) return;
                    pieces.forEach(function (piece) {
                        if (!piece || !piece.plugin) return;
                        if (fitted[piece.plugin.pieceId]) return;
                        var tx = piece.plugin.targetX;
                        var ty = piece.plugin.targetY;
                        var dx = piece.position.x - tx;
                        var dy = piece.position.y - ty;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        var angleDiff = Math.abs(piece.angle - (piece.plugin.targetAngle || 0));
                        if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                        if (dist < snapDistance && angleDiff < snapAngle) {
                            Body.setPosition(piece, { x: tx, y: ty });
                            Body.setAngle(piece, piece.plugin.targetAngle || 0);
                            Body.setVelocity(piece, { x: 0, y: 0 });
                            Body.setAngularVelocity(piece, 0);
                            piece.isSensor = true;
                            fitted[piece.plugin.pieceId] = true;
                            statusEl.textContent = 'Pièce assemblée : ' + piece.plugin.pieceId + '. Reste : ' + (pieceDefs.length - Object.keys(fitted).length);
                            if (Object.keys(fitted).length === pieceDefs.length) {
                                solved = true;
                                statusEl.innerHTML = '<span style="color:#00ff88">Puzzle résolu ! La forme est reconstituée.</span>';
                                resetBtn.disabled = false;
                                try {
                                    localStorage.setItem('td_standalone_game_result', JSON.stringify({
                                        type: 'puzzle',
                                        won: true,
                                        ts: Date.now()
                                    }));
                                } catch (e) {}
                            }
                        }
                    });
                });

                statusEl.textContent = 'Assemblez les pièces pour reconstituer la forme finale.';
                resetBtn.disabled = true;
            }

            function drawBackground(ctx) {
                ctx.fillStyle = '#0d0d1a';
                ctx.fillRect(0, 0, W, H);

                ctx.strokeStyle = '#1f1f3a';
                ctx.lineWidth = 2;
                ctx.strokeRect(20, 20, W - 40, H - 40);

                ctx.fillStyle = 'rgba(255,255,255,0.02)';
                ctx.fillRect(20, 20, W - 40, H - 40);

                ctx.save();
                ctx.translate(W/2, H/2);
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(-160, -120, 320, 240);
                ctx.restore();

                ctx.fillStyle = '#a0c0d0';
                ctx.font = '12px Montserrat, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Zone cible', W/2, H/2 - 140);
            }

            function renderLoop() {
                var ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, W, H);
                drawBackground(ctx);

                pieces.forEach(function (body) {
                    if (!body) return;
                    var pos = body.position;
                    var angle = body.angle;
                    var color = (body.plugin && body.plugin.color) ? body.plugin.color : '#00d4ff';
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(angle);
                    ctx.fillStyle = color;
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 10;
                    var verts = body.vertices;
                    if (verts && verts.length) {
                        ctx.beginPath();
                        ctx.moveTo(verts[0].x - pos.x, verts[0].y - pos.y);
                        for (var i = 1; i < verts.length; i++) {
                            ctx.lineTo(verts[i].x - pos.x, verts[i].y - pos.y);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                if (!solved) {
                    Engine.update(engine, 1000 / 60);
                }

                requestAnimationFrame(renderLoop);
            }

            resetBtn.addEventListener('click', function () {
                if (solved) return;
                initPuzzle();
                statusEl.textContent = 'Puzzle réinitialisé.';
            });

            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }

            var backBtn = document.getElementById('back-to-minigame-btn');
            var storyContinueBtn = document.getElementById('story-continue-btn');
            var fromStory = new URLSearchParams(window.location.search).get('story') === '1';
            if (fromStory) {
                if (backBtn) backBtn.style.display = 'none';
                if (storyContinueBtn) {
                    storyContinueBtn.style.display = 'inline-block';
                    storyContinueBtn.addEventListener('click', function () {
                        try { localStorage.setItem('td_standalone_game_result', JSON.stringify({ type: 'puzzle', won: true, ts: Date.now() })); } catch (e) {}
                        try {
                            var returnRaw = localStorage.getItem('td_standalone_game_return');
                            if (returnRaw) {
                                var rp = JSON.parse(returnRaw);
                                if (rp && rp.returnUrl) {
                                    window.location.href = rp.returnUrl;
                                    return;
                                }
                            }
                        } catch (e) {}
                        window.location.href = '../true-detective/index.html?standalone=puzzle';
                    });
                }
            } else {
                if (backBtn) {
                    backBtn.textContent = 'Accueil';
                    backBtn.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html#minigames';
                    });
                }
            }

            var menuHome = document.getElementById('menu-home');
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=puzzle' : '../true-detective/index.html#minigames';
                });
            }
            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    if (window.DPSettings && window.DPSettings.open) { window.DPSettings.open(); } else { alert('Paramètres : aucun réglage pour l\'instant.'); }
                });
            }

            initPuzzle();
            renderLoop();
        })();
    </script>
</body>
</html>
