<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réseau d'alibis - True Detective</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding-bottom: 80px; }
        .header { background: #16213e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0f3460; }
        .header h1 { font-size: 24px; color: #e94560; }
        .header-buttons { display: flex; gap: 10px; }
        .header-buttons button { background: #0f3460; color: #eee; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .header-buttons button:hover { background: #1a508b; }
        main { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .back-btn { background: #e94560; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-size: 16px; }
        .back-btn:hover { background: #c73e54; }
        #reseau-alibis-app { background: #16213e; border-radius: 10px; padding: 20px; min-height: 400px; }
        .carousel { display: flex; gap: 20px; overflow-x: auto; padding: 20px 0; }
        .testimony-card { background: #0f3460; border-radius: 10px; padding: 20px; min-width: 280px; max-width: 350px; border: 2px solid #1a508b; cursor: pointer; transition: transform 0.2s; }
        .testimony-card:hover { transform: translateY(-5px); }
        .testimony-card h3 { color: #e94560; margin-bottom: 10px; }
        .testimony-card p { color: #ccc; line-height: 1.5; }
        .testimony-card .witness { color: #ffd700; font-size: 14px; margin-top: 10px; }
        .fixed-continue { position: fixed; bottom: 0; left: 0; right: 0; background: #16213e; padding: 15px; text-align: center; border-top: 2px solid #0f3460; }
        .fixed-continue button { background: #e94560; color: #fff; border: none; padding: 12px 40px; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .fixed-continue button:hover { background: #c73e54; }
    </style>
</head>
<body>
    <header class="header">
        <h1>🕸️ Réseau d'alibis</h1>
        <div class="header-buttons">
            <button onclick="alert('Settings')">Settings</button>
            <button onclick="goHome()">Home</button>
        </div>
    </header>
    <main>
        <button class="back-btn" onclick="goBack()">← Back</button>
        <div id="reseau-alibis-app"></div>
    </main>
    <div class="fixed-continue">
        <button onclick="continuer()">Continuer</button>
    </div>
    <script src="minigames.js"></script>
    <script>
        const minigame = TDNarrativeEngine.createMinigame('reseau_alibis', 'reseau-alibis-app');
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            const from = urlParams.get('from') || 'minigames';
            if (from === 'story') {
                window.location.href = '../index.html?mode=story';
            } else {
                window.location.href = '../index.html?mode=minigames';
            }
        }
        function goHome() {
            window.location.href = '../index.html';
        }
        function continuer() {
            if (minigame && typeof minigame.complete === 'function') {
                minigame.complete();
            } else {
                goBack();
            }
        }
    </script>
</body>
</html>
