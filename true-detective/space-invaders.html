<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Space Invaders</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <link rel="stylesheet" href="../settings-menu.css">
    <link rel="stylesheet" href="story-chrome.css">
    <style>
        :root {
            --bg-dark: #03040a;
            --panel-bg: rgba(8, 12, 24, 0.92);
            --neon-pink: #ff006e;
            --neon-blue: #00f0ff;
            --neon-green: #00ff88;
            --text-main: #e8f4ff;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, #100b24 0%, #03040a 100%),
                linear-gradient(rgba(255, 0, 110, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 110, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .si-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
            flex: 1;
            box-sizing: border-box;
            justify-content: center;
        }

        .si-hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 0, 110, 0.3);
            padding: 10px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .si-info {
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        #si-canvas {
            display: block;
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: radial-gradient(circle at center, #0d0c1d 0%, #05050f 100%);
            border: 2px solid var(--neon-pink);
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 110, 0.25);
        }

        .si-touch-controls {
            display: none;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }

        .touch-btn {
            flex: 1;
            background: rgba(255, 0, 110, 0.1);
            border: 1px solid var(--neon-pink);
            color: var(--text-main);
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .touch-btn:active {
            background: rgba(255, 0, 110, 0.3);
        }

        @media (max-width: 768px) {
            .si-touch-controls {
                display: flex;
            }
            #si-canvas {
                height: 320px;
            }
        }
    </style>
</head>
<body>
    <header class="sg-header" style="position:relative; background: rgba(3, 4, 10, 0.95); border-bottom: 1px solid rgba(255, 0, 110, 0.3); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu" style="background:none;border:none;color:var(--neon-pink);font-size:1.3rem;cursor:pointer;">☰</button>
        <h2 class="sg-title" style="color:var(--neon-pink);font-family:'Playfair Display',serif;margin:0;font-size:1.3rem;text-shadow:0 0 10px rgba(255,0,110,0.4);">Space Invaders</h2>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>

    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>

    <main class="sg-main">
        <div class="si-wrap">
            <div class="si-hud">
                <div class="si-info" id="si-info">Score: 0</div>
                <div class="si-info" id="si-lives">Vies: 3</div>
            </div>
            
            <canvas id="si-canvas" width="600" height="400"></canvas>

            <div class="si-touch-controls">
                <button class="touch-btn" id="btn-left">◀</button>
                <button class="touch-btn" id="btn-fire" style="background:rgba(0,240,255,0.1); border-color:var(--neon-blue);">TIR</button>
                <button class="touch-btn" id="btn-right">▶</button>
            </div>
        </div>
    </main>

    <script>
        function getLevel() {
            var level = parseInt(new URLSearchParams(window.location.search).get('level') || '1', 10);
            if (isNaN(level) || level < 1) level = 1;
            if (level > 3) level = 3;
            return level;
        }
    </script>

    <!-- Script principal du jeu intégré avec tirs ennemis -->
    <script>
        (function() {
            const canvas = document.getElementById('si-canvas');
            const ctx = canvas.getContext('2d');
            const currentLevel = getLevel();

            let score = 0;
            let lives = 3;
            const SI_TIERS = [50, 80];
            let enemyTierIdx = 0;
            let gameState = 'PLAYING'; // PLAYING, WIN, GAMEOVER

            // Joueur
            let player = {
                x: canvas.width / 2 - 15,
                y: canvas.height - 35,
                width: 30,
                height: 16,
                speed: 5
            };

            let bullets = [];       // Tirs du joueur
            let enemyBullets = [];   // Tirs des ennemis
            let enemies = [];

            // Configuration des vagues d'ennemis selon le niveau
            const rows = 3 + currentLevel; 
            const cols = 8;
            const enemyWidth = 32;
            const enemyHeight = 20;
            const padding = 12;
            const offsetTop = 40;
            const offsetLeft = 50;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    enemies.push({
                        x: offsetLeft + c * (enemyWidth + padding),
                        y: offsetTop + r * (enemyHeight + padding),
                        width: enemyWidth,
                        height: enemyHeight,
                        alive: true,
                        type: r
                    });
                }
            }

            let enemyDirection = 1;
            let enemySpeed = 1 + (currentLevel * 0.4);
            let keys = {};

            window.addEventListener('keydown', e => { keys[e.key] = true; if(e.key === ' ' || e.key === 'ArrowUp') shoot(); });
            window.addEventListener('keyup', e => { keys[e.key] = false; });

            // Contrôles tactiles
            let leftPressed = false, rightPressed = false;
            document.getElementById('btn-left').addEventListener('touchstart', () => { leftPressed = true; });
            document.getElementById('btn-left').addEventListener('touchend', () => { leftPressed = false; });
            document.getElementById('btn-right').addEventListener('touchstart', () => { rightPressed = true; });
            document.getElementById('btn-right').addEventListener('touchend', () => { rightPressed = false; });
            document.getElementById('btn-fire').addEventListener('click', () => { shoot(); });

            function shoot() {
                if (gameState !== 'PLAYING') return;
                if (bullets.length < 3) { // Max 3 tirs simultanés
                    bullets.push({
                        x: player.x + player.width / 2 - 2,
                        y: player.y,
                        width: 4,
                        height: 10,
                        speed: 7
                    });
                }
            }

            function update() {
                if (gameState !== 'PLAYING') return;

                // Mouvements du joueur
                if ((keys['ArrowLeft'] || keys['q'] || leftPressed) && player.x > 10) {
                    player.x -= player.speed;
                }
                if ((keys['ArrowRight'] || keys['d'] || rightPressed) && player.x < canvas.width - player.width - 10) {
                    player.x += player.speed;
                }

                // Mouvement des tirs du joueur
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].y -= bullets[i].speed;
                    if (bullets[i].y < 0) {
                        bullets.splice(i, 1);
                    }
                }

                // Mouvement des tirs ennemis
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    enemyBullets[i].y += enemyBullets[i].speed;
                    
                    // Collision tir ennemi -> Joueur
                    if (
                        enemyBullets[i].x < player.x + player.width &&
                        enemyBullets[i].x + enemyBullets[i].width > player.x &&
                        enemyBullets[i].y < player.y + player.height &&
                        enemyBullets[i].y + enemyBullets[i].height > player.y
                    ) {
                        enemyBullets.splice(i, 1);
                        lives--; if (window.TDStoryChrome) window.TDStoryChrome.trigger('hit', { value: lives });
                        document.getElementById('si-lives').textContent = "Vies: " + lives;
                        if (lives <= 0) {
                            gameState = 'GAMEOVER';
                            if (window.TDStoryChrome) { window.TDStoryChrome.trigger('defeat'); window.TDStoryChrome.reportResult(false); }
                        }
                        continue;
                    }

                    if (enemyBullets[i].y > canvas.height) {
                        enemyBullets.splice(i, 1);
                    }
                }

                // IA de tir des ennemis (fréquence ajustée selon le niveau)
                let aliveEnemies = enemies.filter(e => e.alive);
                if (aliveEnemies.length > 0 && Math.random() < (0.02 + currentLevel * 0.015)) {
                    let shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                    enemyBullets.push({
                        x: shooter.x + shooter.width / 2 - 2,
                        y: shooter.y + shooter.height,
                        width: 4,
                        height: 10,
                        speed: 3 + currentLevel * 0.5
                    });
                }

                // Déplacement des ennemis
                let hitEdge = false;
                aliveEnemies.forEach(e => {
                    e.x += enemySpeed * enemyDirection;
                    if (e.x + e.width > canvas.width - 10 || e.x < 10) {
                        hitEdge = true;
                    }
                });

                if (hitEdge) {
                    enemyDirection *= -1;
                    enemies.forEach(e => {
                        e.y += 12;
                        // Si un ennemi atteint le bas -> Game Over
                        if (e.alive && e.y + e.height >= player.y) {
                            gameState = 'GAMEOVER';
                            if (window.TDStoryChrome) { window.TDStoryChrome.trigger('defeat'); window.TDStoryChrome.reportResult(false); }
                        }
                    });
                }

                // Collisions tirs joueur -> ennemis
                for (let i = bullets.length - 1; i >= 0; i--) {
                    for (let j = 0; j < enemies.length; j++) {
                        let e = enemies[j];
                        if (e.alive &&
                            bullets[i].x < e.x + e.width &&
                            bullets[i].x + bullets[i].width > e.x &&
                            bullets[i].y < e.y + e.height &&
                            bullets[i].y + bullets[i].height > e.y
                        ) {
                            e.alive = false;
                            bullets.splice(i, 1);
                            score += (e.type + 1) * 10; if (window.TDStoryChrome && enemyTierIdx < SI_TIERS.length) { var killedPct = Math.round(enemies.filter(function (x) { return !x.alive; }).length * 100 / enemies.length); if (killedPct >= SI_TIERS[enemyTierIdx]) { enemyTierIdx++; window.TDStoryChrome.trigger('enemies', { value: SI_TIERS[enemyTierIdx - 1] }); } }
                            playSfx('explosion');
                            document.getElementById('si-info').textContent = "Score: " + score;
                            break;
                        }
                    }
                }

                // Vérification de la victoire
                if (enemies.every(e => !e.alive)) {
                    gameState = 'WIN';
                    if (window.TDStoryChrome) { window.TDStoryChrome.trigger('victory'); window.TDStoryChrome.reportResult(true); }
                    try { localStorage.setItem('td_standalone_game_result', JSON.stringify({ type: 'space-invaders', won: true, ts: Date.now() })); } catch (e) {}
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Dessin du joueur
                ctx.fillStyle = '#00f0ff';
                ctx.fillRect(player.x, player.y + 6, player.width, player.height - 6);
                ctx.fillRect(player.x + player.width / 2 - 3, player.y, 6, 8);

                // Dessin des tirs du joueur
                ctx.fillStyle = '#00ff88';
                bullets.forEach(b => {
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                });

                // Dessin des tirs ennemis
                ctx.fillStyle = '#ff006e';
                enemyBullets.forEach(b => {
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                });

                // Dessin des ennemis
                enemies.forEach(e => {
                    if (e.alive) {
                        ctx.fillStyle = e.type === 0 ? '#ff006e' : (e.type === 1 ? '#ffb852' : '#00f0ff');
                        ctx.fillRect(e.x, e.y, e.width, e.height);
                        // Petits détails visuels pour les ennemis
                        ctx.fillStyle = '#03040a';
                        ctx.fillRect(e.x + 6, e.y + 5, 4, 4);
                        ctx.fillRect(e.x + e.width - 10, e.y + 5, 4, 4);
                    }
                });

                // Messages de fin de partie
                if (gameState !== 'PLAYING') {
                    ctx.fillStyle = 'rgba(3, 4, 10, 0.85)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.font = 'bold 24px Montserrat, sans-serif';
                    ctx.textAlign = 'center';
                    if (gameState === 'WIN') {
                        ctx.fillStyle = '#00ff88';
                        ctx.fillText("VICTOIRE !", canvas.width / 2, canvas.height / 2);
                    } else {
                        ctx.fillStyle = '#ff006e';
                        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
                    }
                }
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            loop();
        })();
    </script>

    <script src="../settings-menu.js"></script>
    <script src="story-chrome.js"></script>
    <script src="standalone-theme.js"></script>
    <script src="sfx.js"></script>
    <script src="minigame-audio.js" data-minigame="space-invaders"></script>
    <script>
        (function () {
            'use strict';
            if (window.DPSettings && window.DPSettings.init) {
                window.DPSettings.init({
                    showMusicToggle: true, showMusicVolume: true, showNarrationVolume: false,
                    showMuteToggle: false, showGameSection: true, showBackToHub: false,
                    showRestart: false, showRules: false, customButtons: [],
                    onBackToHub: function () { window.location.href = '../true-detective/index.html#minigames'; }
                });
            }

            var hamburgerBtn = document.getElementById('hamburger-btn');
            var menu = document.getElementById('hamburger-menu');
            if (hamburgerBtn && menu) {
                hamburgerBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                document.addEventListener('click', function (e) {
                    if (!menu.contains(e.target) && e.target !== hamburgerBtn) {
                        menu.classList.remove('open');
                    }
                });
            }

            var backBtn = document.getElementById('back-to-minigame-btn');
            var fromStory = new URLSearchParams(window.location.search).get('story') === '1';
            
            if (fromStory) {
                if (backBtn) backBtn.style.display = 'none';
                var continueBtn = document.createElement('button');
                continueBtn.id = 'story-continue-btn';
                continueBtn.className = 'btn btn-continue';
                continueBtn.textContent = 'Continuer';
                continueBtn.style.cssText = 'margin-left:8px;padding:6px 14px;font-size:0.75rem;font-weight:700;background:rgba(0,255,136,0.15);border:1px solid #00ff88;border-radius:8px;color:#00ff88;cursor:pointer;font-family:Montserrat,sans-serif;text-transform:uppercase;letter-spacing:0.05em;';
                continueBtn.addEventListener('click', function () {
                    try { localStorage.setItem('td_standalone_game_result', JSON.stringify({ type: 'space-invaders', won: false, ts: Date.now() })); } catch (e) {}
                    try {
                        var returnRaw = localStorage.getItem('td_standalone_game_return');
                        if (returnRaw) {
                            var rp = JSON.parse(returnRaw);
                            if (rp && rp.returnUrl) { window.location.href = rp.returnUrl; return; }
                        }
                    } catch (e) {}
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=space-invaders' : '../true-detective/index.html#minigames';
                });
                var header = document.querySelector('.sg-header');
                if (header) header.appendChild(continueBtn);
            } else {
                if (backBtn) {
                    backBtn.textContent = 'Accueil';
                    backBtn.addEventListener('click', function () {
                        if (menu) menu.classList.remove('open');
                        window.location.href = '../true-detective/index.html#minigames';
                    });
                }
            }

            var menuHome = document.getElementById('menu-home');
            if (fromStory && menuHome) menuHome.style.display = 'none';
            if (menuHome) {
                menuHome.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    window.location.href = fromStory ? '../true-detective/index.html?standalone=space-invaders' : '../true-detective/index.html#minigames';
                });
            }

            var menuSettings = document.getElementById('menu-settings');
            if (menuSettings) {
                menuSettings.addEventListener('click', function () {
                    if (menu) menu.classList.remove('open');
                    if (window.DPSettings && window.DPSettings.open) { window.DPSettings.open(); } else { alert('Paramètres : aucun réglage pour l\'instant.'); }
                });
            }
        })();
    </script>
</body>
</html>
