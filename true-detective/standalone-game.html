<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Detective - Mini-jeu</title>
    <link rel="icon" href="../icon/Logo%20d%26p.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Special+Elite&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="standalone-game.css">
    <link rel="stylesheet" href="../settings-menu.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="story-chrome.css">
</head>
<body>
    <div id="standalone-game-app">
    <header class="sg-header" style="position:relative;">
        <button id="hamburger-btn" class="sg-hamburger" aria-label="Menu">☰</button>
        <h1 class="sg-title" id="sg-title">Mini-jeu</h1>
        <button id="back-to-minigame-btn" class="btn btn-back">Retour</button>
    </header>

    <nav id="hamburger-menu" class="sg-menu">
        <button class="sg-menu-item" id="menu-home">
            <span class="menu-icon">🏠</span>
            <span>Menu principal</span>
        </button>
        <div class="sg-menu-divider"></div>
        <button class="sg-menu-item" id="menu-settings">
            <span class="menu-icon">⚙</span>
            <span>Paramètres</span>
        </button>
    </nav>

        <main class="sg-main">
            <div id="game-container" class="game-container">
                <div id="game-content"></div>
            </div>
        </main>
    </div>

    <script src="sfx.js"></script>
    <script src="minigame-audio.js" data-minigame=""></script>
    <script src="story-chrome.js"></script>
    <script src="standalone-game.js"></script>
    <script src="../settings-menu.js"></script>
</body>
</html>
